name: Feature request
description: Suggest a new capability or improvement.
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or workflow
      description: What are you trying to do, and what is hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the user-facing behavior you want.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - CLI
        - TUI
        - Agent hub
        - Providers/profiles
        - Plugins/hooks
        - Engine/Web UI
        - Documentation
        - Packaging/release
        - Other
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: What would make this complete?
  - type: textarea
    id: spec
    attributes:
      label: Spec
      description: The feature owner writes or links a spec before implementation. Link docs/specs/<name>.md, or write "to be written in the PR that builds it" and use docs/specs/TEMPLATE.md.
    validations:
      required: true

