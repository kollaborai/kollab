name: Model directory refresh

# Weekly regeneration of bundles/data/models.json from two external sources
# (models.dev catalog + OpenRouter public API) via
# scripts/update_model_directory.py. Flag-only by design: the workflow
# opens ONE draft PR and never merges, labels, or edits anything else.
# Curated entries win: the generator only adds missing models and updates
# fields listed in SOURCED_FIELDS, so human-authored notes/flags survive.
# Caveat (documented, accepted): PRs created with GITHUB_TOKEN do not
# trigger other workflows, so CI will not run on these draft PRs until a
# human pushes any branch update; review is expected to run
# scripts/validate_models.py locally (the workflow runs it before opening
# the PR and fails closed if the regenerated file is invalid).
# A workflow is used instead of a hub cron so releases pick up fresh data
# regardless of whether any local hub agent is online.

on:
  schedule:
    # Mondays 09:23 America/Phoenix (16:23 UTC); odd minute avoids
    # top-of-hour load, matching the stale-pr-sweeper convention.
    - cron: "23 16 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Check for drift and report only; skip the refresh PR"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: model-directory-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: model-directory-refresh
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"

      - name: Detect drift (sources vs committed directory)
        id: drift
        run: |
          set -euo pipefail
          check_out="$(python3 scripts/update_model_directory.py --check 2>&1 || true)"
          if printf '%s\n' "$check_out" | grep -q "^OK:"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Model directory already matches the sources." >> "$GITHUB_STEP_SUMMARY"
          else
            changed_count="$(printf '%s\n' "$check_out" \
              | sed -n 's/^STALE: .*(\([0-9]*\) change(s)).*/\1/p' || true)"
            [ -n "$changed_count" ] || changed_count="?"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "change_count=${changed_count}" >> "$GITHUB_OUTPUT"
            echo "Drift detected: ${changed_count} change(s)." >> "$GITHUB_STEP_SUMMARY"
            printf '%s\n' "$check_out" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Regenerate directory (skipped when clean or dry_run)
        if: steps.drift.outputs.changed == 'true' && inputs.dry_run != true
        run: |
          set -euo pipefail
          python3 scripts/update_model_directory.py > /tmp/refresh-report.txt
          # Fail closed: an invalid regenerated file must not reach a PR.
          python3 scripts/validate_models.py
          git diff --stat >> /tmp/refresh-report.txt

      - name: Open draft refresh PR (single reused branch)
        if: steps.drift.outputs.changed == 'true' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          branch="automation/model-directory-refresh"
          git config user.name "kollaborai"
          git config user.email "kollaborai@users.noreply.github.com"
          count="${{ steps.drift.outputs.change_count }}"
          title="chore(models): weekly model directory refresh"
          if [ -n "$count" ] && [ "$count" != "?" ]; then
            title="chore(models): weekly model directory refresh (${count} change(s))"
          fi
          # The runner checkout is fresh, so the local branch never exists yet.
          git checkout -b "$branch"
          if git fetch origin "$branch" 2>/dev/null; then
            # Reused branch from a previous run: continue from its tip so the
            # force-with-lease below never races foreign history.
            git reset --hard FETCH_HEAD
            git clean -fd bundles/data
            python3 scripts/update_model_directory.py > /tmp/refresh-report.txt
            python3 scripts/validate_models.py
            mode="regenerated"
          else
            mode="pushed"
          fi
          git add bundles/data/models.json
          git commit -m "$title"
          if [ "$mode" = "regenerated" ]; then
            git push --force-with-lease origin "$branch"
          else
            git push origin "$branch"
          fi
          {
            echo "### Model directory refresh report"
            echo
            echo '```'
            head -60 /tmp/refresh-report.txt
            echo '```'
            echo
            echo "Regenerated by scripts/update_model_directory.py on $(date -u +%Y-%m-%d)"
            echo "from models.dev and the OpenRouter public API."
            echo "Entries with notes containing 'Auto-generated' were added by the"
            echo "generator; curated fields were preserved."
            echo
            echo "PRs created with GITHUB_TOKEN do not trigger CI; run"
            echo "scripts/validate_models.py locally or push any branch update."
          } > pr-body.md
          cat pr-body.md >> "$GITHUB_STEP_SUMMARY"
          if gh pr view "$branch" --json number >/dev/null 2>&1; then
            gh pr edit "$branch" --title "$title" --body-file pr-body.md
          else
            gh pr create --draft \
              --base main \
              --head "$branch" \
              --title "$title" \
              --body-file pr-body.md
          fi
