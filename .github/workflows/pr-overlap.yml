name: PR overlap detector

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: pr-overlap-${{ github.repository }}
  cancel-in-progress: false

jobs:
  detect:
    name: Detect overlapping pull requests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compare open pull requests and flag overlaps
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          HOME=/tmp/pr-overlap-home KOLLAB_NO_KEYRING=1 python3 .github/scripts/pr_overlap_detector.py
