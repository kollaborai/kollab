name: Base freshness status

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to check; blank checks all open pull requests
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: "base-fresh-${{ github.event.pull_request.number || 'main' }}"
  cancel-in-progress: true

jobs:
  base-fresh:
    name: Post base-fresh status
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"

      - name: Check the pull request
        if: github.event_name == 'pull_request_target'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python scripts/pr_blast_radius.py --repo "$REPO" --pr "$PR_NUMBER" --post

      - name: Check the selected pull request
        if: github.event_name == 'workflow_dispatch' && inputs.pr != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr }}
        run: python scripts/pr_blast_radius.py --repo "$REPO" --pr "$PR_NUMBER" --post

      - name: Check all open pull requests
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.pr)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: python scripts/pr_blast_radius.py --repo "$REPO" --all-open --post
