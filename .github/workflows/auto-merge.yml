name: Auto-merge

# Automatic arming is disabled: the host rules require zero approvals and do
# not establish independent review of the current head. The integrator merges
# manually after the documented gates, using --match-head-commit. Reintroduce
# automatic arming only with an enforceable independent exact-head review gate.
# This workflow deliberately has no PR trigger and no write permissions.

on:
  workflow_dispatch:

permissions: {}

jobs:
  disabled:
    name: automatic arming disabled
    runs-on: ubuntu-latest
    steps:
      - name: Explain the manual gate
        run: |
          echo "Automatic arming is disabled; follow the independent review and manual merge process."
