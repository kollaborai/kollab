name: Auto-merge

# Automatic arming is disabled: the host requires one approval but cannot prove
# that a separate AI agent reviewed the exact final head. The integrator merges
# as kollaborai with a merge commit after the documented gates, using
# --match-head-commit and no admin or ruleset bypass. Reintroduce
# automatic arming only when the host enforces the complete review requirement.
# This workflow deliberately has no PR trigger and no write permissions.

on:
  workflow_dispatch:

permissions: {}

jobs:
  disabled:
    name: automatic arming disabled
    runs-on: ubuntu-latest
    steps:
      - name: Explain the manual gate
        run: |
          echo "Automatic arming is disabled; follow the independent review and manual merge process."
