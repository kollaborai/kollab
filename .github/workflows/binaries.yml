name: Binaries

# The single-file kollab binary for each platform (scripts/build_binary.py) and
# the desktop apps built around it. publish.yml calls this for every v* release
# tag and attaches the results to the GitHub Release, where install.sh and
# /upgrade download them.
#
# Packaging runs only for a release tag or by hand (workflow_dispatch, e.g. on
# release/X.Y.Z before tagging). Pull requests and branch pushes build nothing
# here: PR CI was waiting on this matrix.
#
# desktop-windows is provisional (docs/specs/windows-desktop.md): until the
# native port lands it runs only by hand (workflow_dispatch). A release tag never
# runs it or waits on it, and no Windows asset is published.
on:
  # No tags trigger: publish.yml calls this for every release tag. A tags trigger
  # here built every binary and desktop app twice per release.
  workflow_call:
    inputs:
      version:
        description: The version every binary must report (a release tag such as v0.15.1)
        required: true
        type: string
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: frontend/shared
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Compile the selected frontend once
        working-directory: packages/kollabor-webui/frontend
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build -- --outDir "$RUNNER_TEMP/kollab-frontend"

      - uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: ${{ runner.temp }}/kollab-frontend
          if-no-files-found: error

      - name: Package the connection service with the same frontend
        run: |
          mkdir -p "$RUNNER_TEMP/kollab-service"
          python scripts/relay/build_service.py "$RUNNER_TEMP/kollab-service/source.tar.gz" --frontend-dist "$RUNNER_TEMP/kollab-frontend"
          cd "$RUNNER_TEMP/kollab-service"
          sha256sum source.tar.gz > source.tar.gz.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: connection-service
          path: ${{ runner.temp }}/kollab-service/*
          if-no-files-found: error

  build:
    name: binary/${{ matrix.platform }}
    needs: frontend
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - platform: macos-aarch64
            runner: macos-15
          - platform: macos-x86_64
            runner: macos-15-intel
          - platform: linux-x86_64
            runner: ubuntu-24.04
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          cache-suffix: ${{ github.job }}  # one cache per job, see ci.yml

      - name: Download the selected frontend
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: ${{ runner.temp }}/kollab-frontend

      # Builds the wheels from this commit, packs them with a portable CPython,
      # then runs the binary: --version, kollab's imports and an HTTPS request.
      - name: Build the binary and check that it runs
        env:
          VERSION: ${{ inputs.version }}
          # science, the scie builder pex runs, reads the Python Standalone Builds
          # release from the GitHub API; unauthenticated, runner IPs hit the rate limit.
          SCIENCE_AUTH_API_GITHUB_COM_BEARER: ${{ github.token }}
        run: python scripts/build_binary.py --frontend-dist "$RUNNER_TEMP/kollab-frontend" --out dist/bin ${VERSION:+--expect-version "$VERSION"}

      # Its wheels are picked for glibc 2.28, so it must start on a distro that old.
      - name: Check it runs on the oldest supported Linux
        if: runner.os == 'Linux'
        run: docker run --rm -v "$PWD/dist/bin:/bin-dir:ro" almalinux:8 /bin-dir/kollab-${{ matrix.platform }} --version

      - uses: actions/upload-artifact@v7
        with:
          name: kollab-${{ matrix.platform }}
          path: |
            dist/bin/kollab-${{ matrix.platform }}
            dist/bin/kollab-${{ matrix.platform }}.sha256
          if-no-files-found: error

  desktop:
    name: desktop/${{ matrix.platform }}
    needs: build
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - platform: macos-aarch64
            binary_platform: macos-aarch64
            target: aarch64-apple-darwin
            runner: macos-15
          - platform: macos-x86_64
            binary_platform: macos-x86_64
            target: x86_64-apple-darwin
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv (desktop_release.py stages the runtime with uvx)
        uses: astral-sh/setup-uv@v8.1.0
        with:
          cache-suffix: ${{ github.job }}

      - name: Test Apple signing helper and documented build commands
        run: python desktop/tests/test_apple_signing.py

      - name: Download the CLI sidecar
        uses: actions/download-artifact@v8
        with:
          name: kollab-${{ matrix.binary_platform }}
          path: dist/bin

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      # The npm package ships the prebuilt CLI; `cargo install` compiled it on every run.
      - name: Check pinned Tauri CLI
        run: npx --yes @tauri-apps/cli@2.12.0 --version

      - name: Unpack the CLI into the app runtime and set the release version
        env:
          VERSION: ${{ inputs.version }}
        run: python scripts/desktop_release.py --version "$VERSION" stage --platform ${{ matrix.platform }} --source dist/bin/kollab-${{ matrix.binary_platform }}

      - name: Build unsigned Kollab.app
        working-directory: desktop
        run: npx --yes @tauri-apps/cli@2.12.0 build --config src-tauri/tauri.release.json --bundles app

      - name: Package unsigned desktop assets
        env:
          KOLLAB_NO_KEYRING: "1"
        run: |
          VERSION="$(python -c 'import json; print(json.load(open("desktop/src-tauri/tauri.release.json"))["version"])')"
          APP="desktop/src-tauri/target/release/bundle/macos/Kollab.app"
          test -d "$APP"
          # The app carries the CLI unpacked (desktop_release.py stage), never
          # a scie: codesign cannot sign one. sign-macos.sh copies it into
          # Resources and seals it ad hoc, each Mach-O and then the app, so a
          # quarantined download gets Gatekeeper's Open Anyway path, not "damaged".
          KOLLAB_APP_RUNTIME="$PWD/desktop/src-tauri/binaries/app-runtime-${{ matrix.target }}" \
            bash desktop/scripts/sign-macos.sh seal "$PWD/$APP"
          test ! -e "$APP/Contents/MacOS/kollab"
          test -x "$APP/Contents/Resources/kollab"
          shown="$("$APP/Contents/Resources/kollab" --version)"
          test "${shown##* }" = "$VERSION"
          # The signed extensions load, and running kollab writes nothing into the app.
          # runtime/bin holds only the app's CPython (python3.N, desktop_release.py RUNTIME_PYTHON).
          interpreter=("$APP"/Contents/Resources/runtime/bin/python3.*)
          "${interpreter[0]}" -I -c \
            "import kollabor.application, kollabor_cli_main, kollabor_engine, kollabor_webui, kollabor_voice, plugins"
          codesign --verify --deep --strict --verbose=2 "$APP"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")" = "$VERSION"
          mkdir -p dist/desktop
          base="kollab-desktop-${{ matrix.platform }}-${VERSION}"
          ditto -c -k --keepParent "$APP" "dist/desktop/${base}.app.zip"
          hdiutil create -volname "Kollab" -srcfolder "$APP" \
            -ov -format UDZO "dist/desktop/${base}.dmg"
          (
            cd dist/desktop
            for asset in "${base}.app.zip" "${base}.dmg"; do
              shasum -a 256 "$asset" > "$asset.sha256"
            done
          )
          ls -lh dist/desktop

      - uses: actions/upload-artifact@v7
        with:
          name: kollab-desktop-${{ matrix.platform }}
          path: dist/desktop/*
          if-no-files-found: error

  desktop-linux:
    name: desktop/linux-x86_64
    needs: build
    runs-on: ubuntu-22.04
    env:
      APPIMAGE_EXTRACT_AND_RUN: "1"
      # A scie holds an appended Python archive. Keep its packaged bytes intact.
      NO_STRIP: "1"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev \
            libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf \
            xvfb xauth dbus-x11 xdotool

      - name: Install uv (desktop_release.py stages the runtime with uvx)
        uses: astral-sh/setup-uv@v8.1.0
        with:
          cache-suffix: ${{ github.job }}

      - uses: actions/download-artifact@v8
        with:
          name: kollab-linux-x86_64
          path: dist/bin

      - name: Verify and stage the Linux sidecar
        env:
          VERSION: ${{ inputs.version }}
        run: python scripts/desktop_release.py --version "$VERSION" stage --platform linux-x86_64 --source dist/bin/kollab-linux-x86_64

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Check pinned Tauri CLI
        run: npx --yes @tauri-apps/cli@2.12.0 --version

      - name: Test Linux runtime ownership
        run: cargo test --locked --manifest-path desktop/src-tauri/Cargo.toml

      - name: Build Linux AppImage and Debian packages
        working-directory: desktop
        run: npx --yes @tauri-apps/cli@2.12.0 build --config src-tauri/tauri.release.json --bundles appimage,deb

      - name: Check and collect Linux packages
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python scripts/desktop_release.py --version "$VERSION" collect --platform linux-x86_64
          dpkg-deb --info dist/desktop/*.deb
          dpkg-deb --contents dist/desktop/*.deb
          dpkg-deb --extract dist/desktop/*.deb "$RUNNER_TEMP/kollab-deb-check"
          test -x "$RUNNER_TEMP/kollab-deb-check/usr/bin/kollab-desktop"
          test -x "$RUNNER_TEMP/kollab-deb-check/usr/share/kollab/runtime/kollab"
          cmp dist/bin/kollab-linux-x86_64 "$RUNNER_TEMP/kollab-deb-check/usr/share/kollab/runtime/kollab"
          "$RUNNER_TEMP/kollab-deb-check/usr/share/kollab/runtime/kollab" --version
          dpkg-deb --field dist/desktop/*.deb Depends | grep -w xdg-utils
          mkdir -p "$RUNNER_TEMP/kollab-appimage-check"
          (
            cd "$RUNNER_TEMP/kollab-appimage-check"
            "$GITHUB_WORKSPACE"/dist/desktop/*.AppImage --appimage-extract > /dev/null
            test -x squashfs-root/usr/bin/kollab-desktop
            test -x squashfs-root/usr/share/kollab/runtime/kollab
            cmp "$GITHUB_WORKSPACE/dist/bin/kollab-linux-x86_64" squashfs-root/usr/share/kollab/runtime/kollab
            squashfs-root/usr/share/kollab/runtime/kollab --version
          )
          (
            cd dist/desktop
            sha256sum -c ./*.sha256
          )

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: kollab-desktop-linux-x86_64
          path: dist/desktop/*
          if-no-files-found: error

      - name: Smoke the packaged Linux window and attached-runtime lifecycle
        run: dbus-run-session -- xvfb-run -a python scripts/check_desktop_package.py dist/desktop/*.AppImage

  # Windows builds its own runtime here instead of taking one from `build`: the
  # scie is no release asset (install.sh and /upgrade know no Windows binary), so
  # it lives only in the installer. Manual runs only until the native port lands:
  # the agent check fails until then, and a release must not wait on a job that
  # is known to fail. Promotion is in docs/specs/windows-desktop.md.
  desktop-windows:
    name: desktop/windows-x86_64
    if: github.event_name == 'workflow_dispatch'
    needs: frontend
    runs-on: windows-2025
    continue-on-error: true
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv (the runtime build and staging run uvx)
        uses: astral-sh/setup-uv@v8.1.0
        with:
          cache-suffix: ${{ github.job }}

      - name: Download the selected frontend
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: ${{ runner.temp }}/kollab-frontend

      - name: Build the Windows binary and check that it runs
        env:
          VERSION: ${{ inputs.version }}
          SCIENCE_AUTH_API_GITHUB_COM_BEARER: ${{ github.token }}
        run: python scripts/build_binary.py --frontend-dist "$RUNNER_TEMP/kollab-frontend" --out dist/bin ${VERSION:+--expect-version "$VERSION"}

      # A runtime that cannot start an agent must not ship in an installer that
      # looks like it works. Until the native port lands this fails with the
      # runtime's own error; the packaging steps below still run, so the Tauri
      # Windows build is checked meanwhile.
      - name: Check that the binary can run agents
        id: agents
        continue-on-error: true
        run: python scripts/build_binary.py --agent-smoke dist/bin/kollab-windows-x86_64.exe

      - name: Verify and stage the Windows sidecar
        env:
          VERSION: ${{ inputs.version }}
        run: python scripts/desktop_release.py --version "$VERSION" stage --platform windows-x86_64 --source dist/bin/kollab-windows-x86_64.exe

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Check pinned Tauri CLI
        run: npx --yes @tauri-apps/cli@2.12.0 --version

      - name: Test the Windows shell
        run: cargo test --locked --manifest-path desktop/src-tauri/Cargo.toml

      - name: Build the Windows installer
        working-directory: desktop
        run: npx --yes @tauri-apps/cli@2.12.0 build --config src-tauri/tauri.release.json --bundles nsis

      - name: Check and collect the Windows installer
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python scripts/desktop_release.py --version "$VERSION" collect --platform windows-x86_64
          (
            cd dist/desktop
            sha256sum -c ./*.sha256
          )

      - name: Smoke the installed Windows app
        run: python scripts/check_desktop_package_windows.py dist/desktop/*-setup.exe

      # Not a kollab-* artifact: nothing downloads it into a release.
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: windows-desktop-unverified
          path: dist/desktop/*
          if-no-files-found: ignore

      - name: Refuse to release an installer whose runtime cannot run agents
        if: steps.agents.outcome != 'success'
        run: |
          echo "::error::The Windows runtime cannot start an agent yet (docs/specs/windows-desktop.md, 'Port work'); the installer is not released."
          exit 1

      - uses: actions/upload-artifact@v7
        with:
          name: kollab-desktop-windows-x86_64
          path: dist/desktop/*
          if-no-files-found: error

  release-manifest:
    name: release/manifest
    needs: [build, desktop, desktop-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - uses: actions/download-artifact@v8
        with:
          pattern: kollab-*
          path: dist/bin
          merge-multiple: true

      # The Windows installer pair is optional (desktop-windows is not part of a
      # release yet) but never half there. Add `--windows required` once the
      # Windows job is promoted.
      - name: Verify all CLI, macOS and Linux release assets, and Windows if built
        env:
          VERSION: ${{ inputs.version }}
        run: python scripts/desktop_release.py --version "$VERSION" verify dist/bin
