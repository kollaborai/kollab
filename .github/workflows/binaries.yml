name: Binaries

# The single-file kollab binary for each platform (scripts/build_binary.py).
# publish.yml calls this for every release tag and attaches the binaries to the
# GitHub Release, where install.sh and /upgrade download them. Pull requests that
# change the build or the code that installs a binary run it as a check.
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/binaries.yml
      - scripts/build_binary.py
      - install.sh
      - kollabor/binary.py
      - kollabor/updates/auto_update.py
      - pyproject.toml
      - packages/*/pyproject.toml
      - uv.lock
      - desktop/**
  workflow_call:
    inputs:
      version:
        description: The version every binary must report (a release tag such as v0.15.1)
        required: true
        type: string
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: binary/${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - platform: macos-aarch64
            runner: macos-14
          - platform: macos-x86_64
            runner: macos-15-intel
          - platform: linux-x86_64
            runner: ubuntu-24.04
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      # Builds the wheels from this commit, packs them with a portable CPython,
      # then runs the binary: --version, kollab's imports and an HTTPS request.
      - name: Build the binary and check that it runs
        env:
          VERSION: ${{ inputs.version }}
          # science, the scie builder pex runs, reads the Python Standalone Builds
          # release from the GitHub API; unauthenticated, runner IPs hit the rate limit.
          SCIENCE_AUTH_API_GITHUB_COM_BEARER: ${{ github.token }}
        run: python scripts/build_binary.py --out dist/bin ${VERSION:+--expect-version "$VERSION"}

      # Its wheels are picked for glibc 2.28, so it must start on a distro that old.
      - name: Check it runs on the oldest supported Linux
        if: runner.os == 'Linux'
        run: docker run --rm -v "$PWD/dist/bin:/bin-dir:ro" almalinux:8 /bin-dir/kollab-${{ matrix.platform }} --version

      - uses: actions/upload-artifact@v7
        with:
          name: kollab-${{ matrix.platform }}
          path: |
            dist/bin/kollab-${{ matrix.platform }}
            dist/bin/kollab-${{ matrix.platform }}.sha256
          if-no-files-found: error

  desktop:
    name: desktop/${{ matrix.platform }}
    needs: build
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - platform: macos-aarch64
            binary_platform: macos-aarch64
            target: aarch64-apple-darwin
            runner: macos-14
          - platform: macos-x86_64
            binary_platform: macos-x86_64
            target: x86_64-apple-darwin
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v6

      - name: Download the CLI sidecar
        uses: actions/download-artifact@v8
        with:
          name: kollab-${{ matrix.binary_platform }}
          path: dist/bin

      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked --version "^2"

      - name: Prepare the sidecar and release version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          mkdir -p desktop/src-tauri/binaries
          cp "dist/bin/kollab-${{ matrix.binary_platform }}" \
            "desktop/src-tauri/binaries/kollab-${{ matrix.target }}"
          chmod +x "desktop/src-tauri/binaries/kollab-${{ matrix.target }}"
          if [ -n "$VERSION" ]; then
            VERSION="${VERSION#v}" python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("desktop/src-tauri/tauri.conf.json")
          config = json.loads(path.read_text())
          config["version"] = os.environ["VERSION"]
          path.write_text(json.dumps(config, indent=2) + "\n")
          PY
          fi

      - name: Build unsigned Kollab.app
        working-directory: desktop
        run: cargo tauri build --bundles app

      - name: Package unsigned desktop assets
        env:
          VERSION: ${{ inputs.version }}
        run: |
          VERSION="${VERSION#v}"
          VERSION="${VERSION:-dev}"
          APP="desktop/src-tauri/target/release/bundle/macos/Kollab.app"
          test -d "$APP"
          mkdir -p dist/desktop
          base="kollab-desktop-${{ matrix.platform }}-${VERSION}"
          ditto -c -k --keepParent "$APP" "dist/desktop/${base}.app.zip"
          hdiutil create -volname "Kollab" -srcfolder "$APP" \
            -ov -format UDZO "dist/desktop/${base}.dmg"
          for asset in dist/desktop/${base}.app.zip dist/desktop/${base}.dmg; do
            shasum -a 256 "$asset" > "$asset.sha256"
          done
          ls -lh dist/desktop

      - uses: actions/upload-artifact@v7
        with:
          name: kollab-desktop-${{ matrix.platform }}
          path: dist/desktop/*
          if-no-files-found: error
