name: Binaries

# The single-file kollab binary for each platform (scripts/build_binary.py) and
# the desktop apps built around it. publish.yml calls this with an immutable
# release source SHA and attaches the results to the GitHub Release, where
# install.sh and /upgrade download them.
#
# Packaging runs only through the release controller or by hand. A
# writer-branch run is rehearsal; pre-tag proof must identify the merged source.
# Pull requests and branch pushes build nothing
# here: PR CI was waiting on this matrix.
#
# desktop-windows runs for every release, like desktop and desktop-linux: its
# installer ships only if the runtime passes the agent check
# (docs/specs/windows-desktop.md, "The gate").
on:
  # No tags trigger: the main publishing controller supplies release source.
  # A tags trigger here built every binary and desktop app twice per release.
  workflow_call:
    inputs:
      version:
        description: The version every binary must report (a release tag such as v0.15.1)
        required: true
        type: string
      source_ref:
        description: Immutable release source commit resolved by the main controller
        required: true
        type: string
  workflow_dispatch:
    inputs:
      apple_signing_mode:
        description: Optional Developer ID signing and notarization
        type: choice
        options: [unsigned, developer-id]
        default: unsigned

permissions:
  contents: read

jobs:
  frontend:
    name: frontend/shared
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Compile the selected frontend once
        working-directory: packages/kollabor-webui/frontend
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build -- --outDir "$RUNNER_TEMP/kollab-frontend"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: frontend-dist
          path: ${{ runner.temp }}/kollab-frontend
          if-no-files-found: error

      - name: Package the connection service with the same frontend
        run: |
          mkdir -p "$RUNNER_TEMP/kollab-service"
          python scripts/relay/build_service.py "$RUNNER_TEMP/kollab-service/source.tar.gz" --frontend-dist "$RUNNER_TEMP/kollab-frontend"
          cd "$RUNNER_TEMP/kollab-service"
          sha256sum source.tar.gz > source.tar.gz.sha256

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: connection-service
          path: ${{ runner.temp }}/kollab-service/*
          if-no-files-found: error

  build:
    name: binary/${{ matrix.platform }}
    needs: frontend
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - platform: macos-aarch64
            runner: macos-15
          - platform: macos-x86_64
            runner: macos-15-intel
          - platform: linux-x86_64
            runner: ubuntu-24.04
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: false

      - name: Download the selected frontend
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: frontend-dist
          path: ${{ runner.temp }}/kollab-frontend

      # Builds the wheels from this commit, packs them with a portable CPython,
      # then runs the binary: --version, kollab's imports and an HTTPS request.
      - name: Build the binary and check that it runs
        env:
          VERSION: ${{ inputs.version }}
          # science, the scie builder pex runs, reads the Python Standalone Builds
          # release from the GitHub API; unauthenticated, runner IPs hit the rate limit.
          SCIENCE_AUTH_API_GITHUB_COM_BEARER: ${{ github.token }}
        run: python scripts/build_binary.py --frontend-dist "$RUNNER_TEMP/kollab-frontend" --out dist/bin ${VERSION:+--expect-version "$VERSION"}

      # Its wheels are picked for glibc 2.28, so it must start on a distro that old.
      - name: Check it runs on the oldest supported Linux
        if: runner.os == 'Linux'
        run: docker run --rm -v "$PWD/dist/bin:/bin-dir:ro" almalinux:8 /bin-dir/kollab-${{ matrix.platform }} --version

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: kollab-${{ matrix.platform }}
          path: |
            dist/bin/kollab-${{ matrix.platform }}
            dist/bin/kollab-${{ matrix.platform }}.sha256
          if-no-files-found: error

  desktop:
    name: desktop/${{ matrix.platform }}
    needs: build
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - platform: macos-aarch64
            binary_platform: macos-aarch64
            target: aarch64-apple-darwin
            runner: macos-15
          - platform: macos-x86_64
            binary_platform: macos-x86_64
            target: x86_64-apple-darwin
            runner: macos-15-intel
    env:
      APPLE_SIGNING_MODE: ${{ inputs.apple_signing_mode || 'unsigned' }}
      KOLLAB_APP_RUNTIME: ${{ github.workspace }}/desktop/src-tauri/binaries/app-runtime-${{ matrix.target }}
    steps:
      - name: Check the explicitly selected mode and trusted ref
        shell: bash
        run: |
          case "$APPLE_SIGNING_MODE" in
            unsigned) ;;
            developer-id)
              [ "$GITHUB_REF" = refs/heads/main ] || { echo 'Developer ID builds require main.' >&2; exit 1; }
              ;;
            *) echo 'Unknown Apple signing mode.' >&2; exit 1 ;;
          esac
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"

      - name: Install uv (desktop_release.py stages the runtime with uvx)
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: false

      - name: Test Apple signing helper and documented build commands
        run: python desktop/tests/test_apple_signing.py

      - name: Download the CLI sidecar
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: kollab-${{ matrix.binary_platform }}
          path: dist/bin

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          package-manager-cache: false

      # The npm package ships the prebuilt CLI; `cargo install` compiled it on every run.
      - name: Check pinned Tauri CLI
        run: npx --yes @tauri-apps/cli@2.12.0 --version

      - name: Unpack the CLI into the app runtime and set the release version
        env:
          VERSION: ${{ inputs.version }}
        run: python scripts/desktop_release.py --version "$VERSION" stage --platform ${{ matrix.platform }} --source dist/bin/kollab-${{ matrix.binary_platform }}

      - name: Build unsigned Kollab.app
        if: env.APPLE_SIGNING_MODE == 'unsigned'
        working-directory: desktop
        run: npx --yes @tauri-apps/cli@2.12.0 build --config src-tauri/tauri.release.json --bundles app

      - name: Build the Developer ID signed Kollab.app
        if: env.APPLE_SIGNING_MODE == 'developer-id' && github.ref == 'refs/heads/main'
        working-directory: desktop
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          export APPLE_SIGNING_STATE_DIR="$RUNNER_TEMP/kollab-apple-signing-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          printf 'APPLE_SIGNING_STATE_DIR=%s\n' "$APPLE_SIGNING_STATE_DIR" >> "$GITHUB_ENV"
          # The wrapper runs the build itself (hardened-runtime overlay merged
          # ahead of the release version overlay), adds the staged runtime,
          # signs, notarizes, staples and cleans up its keychain state.
          bash scripts/sign-macos.sh build \
            "$GITHUB_WORKSPACE/desktop/src-tauri/target/release/bundle/macos/Kollab.app" -- \
            npx --yes @tauri-apps/cli@2.12.0 build \
            --config '{"bundle":{"macOS":{"hardenedRuntime":true}}}' \
            --config src-tauri/tauri.release.json \
            --bundles app

      - name: Package unsigned desktop assets
        env:
          KOLLAB_NO_KEYRING: "1"
        run: |
          VERSION="$(python -c 'import json; print(json.load(open("desktop/src-tauri/tauri.release.json"))["version"])')"
          APP="desktop/src-tauri/target/release/bundle/macos/Kollab.app"
          test -d "$APP"
          # The app carries the CLI unpacked (desktop_release.py stage), never
          # a scie: codesign cannot sign one. sign-macos.sh copies it into
          # Resources and seals it ad hoc, each Mach-O and then the app, so a
          # quarantined download gets Gatekeeper's Open Anyway path, not "damaged".
          # developer-id builds were sealed, notarized and stapled by the
          # build step; only the unsigned path seals here.
          if [ "$APPLE_SIGNING_MODE" = unsigned ]; then
            bash desktop/scripts/sign-macos.sh seal "$PWD/$APP"
          fi
          test ! -e "$APP/Contents/MacOS/kollab"
          test -x "$APP/Contents/Resources/kollab"
          shown="$("$APP/Contents/Resources/kollab" --version)"
          test "${shown##* }" = "$VERSION"
          # The signed extensions load, and running kollab writes nothing into the app.
          # runtime/bin holds only the app's CPython (python3.N, desktop_release.py RUNTIME_PYTHON).
          interpreter=("$APP"/Contents/Resources/runtime/bin/python3.*)
          "${interpreter[0]}" -I -c \
            "import kollabor.application, kollabor_cli_main, kollabor_engine, kollabor_webui, kollabor_voice, plugins"
          codesign --verify --deep --strict --verbose=2 "$APP"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")" = "$VERSION"
          mkdir -p dist/desktop
          base="kollab-desktop-${{ matrix.platform }}-${VERSION}"
          ditto -c -k --keepParent "$APP" "dist/desktop/${base}.app.zip"
          # The dmg is an install image: the app sits next to an
          # Applications symlink so the standard drag-to-install works (#1083).
          staging="$(mktemp -d)"
          ditto "$APP" "$staging/Kollab.app"
          ln -s /Applications "$staging/Applications"
          hdiutil create -volname "Kollab" -srcfolder "$staging" \
            -ov -format UDZO "dist/desktop/${base}.dmg"
          rm -rf "$staging"
          (
            cd dist/desktop
            for asset in "${base}.app.zip" "${base}.dmg"; do
              shasum -a 256 "$asset" > "$asset.sha256"
            done
          )
          ls -lh dist/desktop

      - name: Verify the dmg layout (Applications shortcut, sealed app)
        run: |
          VERSION="$(python -c 'import json; print(json.load(open("desktop/src-tauri/tauri.release.json"))["version"])')"
          base="kollab-desktop-${{ matrix.platform }}-${VERSION}"
          mount_dir="$(mktemp -d)"
          hdiutil attach "dist/desktop/${base}.dmg" -nobrowse -readonly -mountpoint "$mount_dir"
          test -L "$mount_dir/Applications"
          test "$(readlink "$mount_dir/Applications")" = "/Applications"
          test -d "$mount_dir/Kollab.app"
          codesign --verify --deep --strict "$mount_dir/Kollab.app"
          hdiutil detach "$mount_dir"

      - name: Notarize and staple the dmg
        if: env.APPLE_SIGNING_MODE == 'developer-id' && github.ref == 'refs/heads/main'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          VERSION="$(python -c 'import json; print(json.load(open("desktop/src-tauri/tauri.release.json"))["version"])')"
          base="kollab-desktop-${{ matrix.platform }}-${VERSION}"
          export APPLE_SIGNING_STATE_DIR="$RUNNER_TEMP/kollab-apple-signing-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-dmg"
          printf 'APPLE_SIGNING_STATE_DIR=%s\n' "$APPLE_SIGNING_STATE_DIR" >> "$GITHUB_ENV"
          bash desktop/scripts/sign-macos.sh notarize-dmg "$GITHUB_WORKSPACE/dist/desktop/${base}.dmg"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: kollab-desktop-${{ matrix.platform }}
          path: dist/desktop/*
          if-no-files-found: error

      - name: Retry the signing-state cleanup once, always
        if: always() && env.APPLE_SIGNING_MODE == 'developer-id'
        run: bash desktop/scripts/sign-macos.sh cleanup

  desktop-linux:
    name: desktop/linux-x86_64
    needs: build
    runs-on: ubuntu-22.04
    env:
      APPIMAGE_EXTRACT_AND_RUN: "1"
      # A scie holds an appended Python archive. Keep its packaged bytes intact.
      NO_STRIP: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"

      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev \
            libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf \
            xvfb xauth dbus-x11 xdotool

      - name: Install uv (desktop_release.py stages the runtime with uvx)
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: kollab-linux-x86_64
          path: dist/bin

      - name: Verify and stage the Linux sidecar
        env:
          VERSION: ${{ inputs.version }}
        run: python scripts/desktop_release.py --version "$VERSION" stage --platform linux-x86_64 --source dist/bin/kollab-linux-x86_64

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Check pinned Tauri CLI
        run: npx --yes @tauri-apps/cli@2.12.0 --version

      - name: Test Linux runtime ownership
        run: cargo test --locked --manifest-path desktop/src-tauri/Cargo.toml

      - name: Build Linux AppImage and Debian packages
        working-directory: desktop
        run: npx --yes @tauri-apps/cli@2.12.0 build --config src-tauri/tauri.release.json --bundles appimage,deb

      - name: Check and collect Linux packages
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python scripts/desktop_release.py --version "$VERSION" collect --platform linux-x86_64
          dpkg-deb --info dist/desktop/*.deb
          dpkg-deb --contents dist/desktop/*.deb
          dpkg-deb --extract dist/desktop/*.deb "$RUNNER_TEMP/kollab-deb-check"
          test -x "$RUNNER_TEMP/kollab-deb-check/usr/bin/kollab-desktop"
          test -x "$RUNNER_TEMP/kollab-deb-check/usr/share/kollab/runtime/kollab"
          cmp dist/bin/kollab-linux-x86_64 "$RUNNER_TEMP/kollab-deb-check/usr/share/kollab/runtime/kollab"
          "$RUNNER_TEMP/kollab-deb-check/usr/share/kollab/runtime/kollab" --version
          dpkg-deb --field dist/desktop/*.deb Depends | grep -w xdg-utils
          mkdir -p "$RUNNER_TEMP/kollab-appimage-check"
          (
            cd "$RUNNER_TEMP/kollab-appimage-check"
            "$GITHUB_WORKSPACE"/dist/desktop/*.AppImage --appimage-extract > /dev/null
            test -x squashfs-root/usr/bin/kollab-desktop
            test -x squashfs-root/usr/share/kollab/runtime/kollab
            cmp "$GITHUB_WORKSPACE/dist/bin/kollab-linux-x86_64" squashfs-root/usr/share/kollab/runtime/kollab
            squashfs-root/usr/share/kollab/runtime/kollab --version
          )
          (
            cd dist/desktop
            sha256sum -c ./*.sha256
          )

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: kollab-desktop-linux-x86_64
          path: dist/desktop/*
          if-no-files-found: error

      - name: Smoke the packaged Linux window and attached-runtime lifecycle
        run: dbus-run-session -- xvfb-run -a python scripts/check_desktop_package.py dist/desktop/*.AppImage

  # Windows builds its own runtime here instead of taking one from `build`: the
  # scie is no release asset (install.sh and /upgrade know no Windows binary), so
  # it lives only in the installer. The agent check gates the release
  # (docs/specs/windows-desktop.md, "The gate").
  desktop-windows:
    name: desktop/windows-x86_64
    needs: frontend
    runs-on: windows-2025
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"

      - name: Install uv (the runtime build and staging run uvx)
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: false

      - name: Download the selected frontend
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: frontend-dist
          path: ${{ runner.temp }}/kollab-frontend

      - name: Build the Windows binary and check that it runs
        env:
          VERSION: ${{ inputs.version }}
          SCIENCE_AUTH_API_GITHUB_COM_BEARER: ${{ github.token }}
        run: python scripts/build_binary.py --frontend-dist "$RUNNER_TEMP/kollab-frontend" --out dist/bin ${VERSION:+--expect-version "$VERSION"}

      # A runtime that cannot start an agent must not ship in an installer that
      # looks like it works. A failure shows the runtime's own error; the
      # packaging steps below still run, so the Tauri Windows build is checked
      # either way, and the gate step at the end fails the release.
      - name: Check that the binary can run agents
        id: agents
        continue-on-error: true
        run: python scripts/build_binary.py --agent-smoke dist/bin/kollab-windows-x86_64.exe

      - name: Verify and stage the Windows sidecar
        env:
          VERSION: ${{ inputs.version }}
        run: python scripts/desktop_release.py --version "$VERSION" stage --platform windows-x86_64 --source dist/bin/kollab-windows-x86_64.exe

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Check pinned Tauri CLI
        run: npx --yes @tauri-apps/cli@2.12.0 --version

      - name: Test the Windows shell
        run: cargo test --locked --manifest-path desktop/src-tauri/Cargo.toml

      - name: Build the Windows installer
        working-directory: desktop
        run: npx --yes @tauri-apps/cli@2.12.0 build --config src-tauri/tauri.release.json --bundles nsis

      - name: Check and collect the Windows installer
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python scripts/desktop_release.py --version "$VERSION" collect --platform windows-x86_64
          (
            cd dist/desktop
            sha256sum -c ./*.sha256
          )

      - name: Smoke the installed Windows app
        run: python scripts/check_desktop_package_windows.py dist/desktop/*-setup.exe

      # Not a kollab-* artifact: nothing downloads it into a release.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ !cancelled() }}
        with:
          name: windows-desktop-unverified
          path: dist/desktop/*
          if-no-files-found: ignore

      - name: Refuse to release an installer whose runtime cannot run agents
        if: steps.agents.outcome != 'success'
        run: |
          echo "::error::The Windows runtime failed the agent check (docs/specs/windows-desktop.md, 'The gate'); the installer is not released."
          exit 1

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: kollab-desktop-windows-x86_64
          path: dist/desktop/*
          if-no-files-found: error

  release-manifest:
    name: release/manifest
    needs: [build, desktop, desktop-linux, desktop-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: kollab-*
          path: dist/bin
          merge-multiple: true

      - name: Verify all CLI, macOS, Linux and Windows release assets
        env:
          VERSION: ${{ inputs.version }}
        run: python scripts/desktop_release.py --version "$VERSION" verify dist/bin --windows required
