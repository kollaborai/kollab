name: CI

on:
  # integration/** too: lane PRs merge there first, and none may reach
  # Marco for approval without its own checks.
  pull_request:
    branches: [main, "release/**", "integration/**"]
  push:
    branches: [main, "release/**", "integration/**"]
  # A push performed with GITHUB_TOKEN cannot trigger another workflow. The
  # post-auto-merge gate uses this explicit event to run CI against main.
  workflow_dispatch:
  # The merge queue (#857) tests each queued PR merged onto the latest main, so
  # the required checks must also report on the queue's merge-group commits.
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  tests:
    name: ci/tests (${{ matrix.shard.gem }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.14 is the floor and the launch runtime. Nine gem-named shards
        # keep every leg under the three-minute run goal (#1022); the names are
        # cosmetic (the hash split below decides content), the index feeds it,
        # and SHARD_COUNT must match the list length.
        python-version: ["3.14"]
        shard:
          - { index: 0, gem: amber }
          - { index: 1, gem: beryl }
          - { index: 2, gem: coral }
          - { index: 3, gem: diamond }
          - { index: 4, gem: garnet }
          - { index: 5, gem: jade }
          - { index: 6, gem: opal }
          - { index: 7, gem: ruby }
          - { index: 8, gem: sapphire }

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          # Matrix legs need separate caches; otherwise they race to save one key.
          cache-suffix: ${{ github.job }}-${{ matrix.shard.gem }}

      # Wheel/editable builds fail instead of substituting an older WebUI.
      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install workspace
        run: uv sync --all-packages --extra dev

      # Hash test files across the matrix. Files whose tests run multi-second
      # each are hashed by test item so one file can't dominate a shard (#1022).
      # Keep the two parallel-sensitive tests serial in the support job (#470).
      - name: Run unit test shard
        env:
          SHARD: ${{ matrix.shard.index }}
          SHARD_COUNT: 9
        run: |
          set -euo pipefail
          selected_files=$(find tests/unit -type f -name 'test_*.py' -print |
            LC_ALL=C sort |
            python -c '
          import hashlib
          import os
          import sys

          # Files whose tests run multi-second each: hashed by test item so no
          # one of them can land whole in one shard and bound the run (#1022).
          # test_network_members.py is skipped here and absent from the
          # item-split below: its revocation tests run minutes each and own
          # the dedicated heavy job, so no shard picks the file up whole.
          SLOW_FILES = {
              b"tests/unit/test_network_members.py",
              b"tests/unit/test_mesh_network.py",
              b"tests/unit/test_kill_switch_f13.py",
              b"tests/unit/test_crystal_store_cache.py",
              b"tests/unit/test_config_hooks.py",
              b"tests/unit/test_ghost_response.py",
          }
          shard = int(sys.argv[1])
          shard_count = int(sys.argv[2])
          for path in sys.stdin.buffer:
              path = path.rstrip(b"\n")
              if path in SLOW_FILES:
                  continue
              digest = hashlib.sha256(b"kollab-ci-tests:" + path).digest()
              if int.from_bytes(digest[:4], "big") % shard_count == shard:
                  print(os.fsdecode(path))
          ' "$SHARD" "$SHARD_COUNT")
          test_files=()
          if [ -n "$selected_files" ]; then
            mapfile -t test_files <<< "$selected_files"
          fi

          slow_tests=()
          selected_slow_tests=$(
              uv run python -m pytest \
                tests/unit/test_mesh_network.py \
                tests/unit/test_kill_switch_f13.py \
                tests/unit/test_crystal_store_cache.py \
                tests/unit/test_config_hooks.py \
                tests/unit/test_ghost_response.py --collect-only -q |
                python -c '
          import hashlib
          import os
          import sys

          shard = int(sys.argv[1])
          shard_count = int(sys.argv[2])
          for nodeid in sys.stdin.buffer:
              nodeid = nodeid.rstrip(b"\n")
              if b"::" not in nodeid:
                  continue
              digest = hashlib.sha256(b"kollab-ci-tests:" + nodeid).digest()
              if int.from_bytes(digest[:4], "big") % shard_count == shard:
                  print(os.fsdecode(nodeid))
          ' "$SHARD" "$SHARD_COUNT"
            )
          if [ -z "$selected_slow_tests" ]; then
            echo "Slow-file shard $SHARD discovered no test items" >&2
            exit 1
          fi
          mapfile -t slow_tests <<< "$selected_slow_tests"

          test_targets=("${test_files[@]}" "${slow_tests[@]}")
          if [ "${#test_targets[@]}" -eq 0 ]; then
            echo "Unit-test shard $SHARD discovered no test targets" >&2
            exit 1
          fi
          printf 'Shard %s selected %s files and %s slow-file test items\n' \
            "$SHARD" "${#test_files[@]}" "${#slow_tests[@]}"
          # --durations surfaces the real CI-runner hot spots in every shard log,
          # so a slow shard can be rebalanced from evidence instead of guesses.
          uv run python -m pytest "${test_targets[@]}" -q -n auto --durations=25 \
            --deselect=tests/unit/test_hub_email_bridge.py::test_disconnect_ends_a_poll_blocked_in_idle \
            --deselect=tests/unit/test_relay_build_allowlist.py::test_packaged_relay_imports_and_help_from_allowlist_alone

  # The network-membership revocation tests run minutes each (one is ~140s on
  # a runner); hashed into shards they made whichever shard drew them the
  # slowest job of the run. These two dedicated lanes isolate them so the
  # shards stay flat (#1022); each lane hashes the file's test items across
  # itself, so the one ~140s test cannot stack with the other revocation
  # tests behind a single job.
  heavy_tests:
    name: ci/tests (heavy ${{ matrix.lane }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lane: [a, b]

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          cache-suffix: ${{ github.job }}-${{ matrix.lane }}

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install workspace
        run: uv sync --all-packages --extra dev

      - name: Run this lane's network membership tests
        env:
          HEAVY_LANE: ${{ matrix.lane }}
        run: |
          set -euo pipefail
          lane=0
          [ "$HEAVY_LANE" = "b" ] && lane=1
          selected=$(
            uv run python -m pytest tests/unit/test_network_members.py --collect-only -q |
            python -c '
          import hashlib
          import os
          import sys

          lane = int(sys.argv[1])
          for nodeid in sys.stdin.buffer:
              nodeid = nodeid.rstrip(b"\n")
              if b"::" not in nodeid:
                  continue
              digest = hashlib.sha256(b"kollab-ci-heavy:" + nodeid).digest()
              if int.from_bytes(digest[:4], "big") % 2 == lane:
                  print(os.fsdecode(nodeid))
          ' "$lane"
          )
          mapfile -t targets <<< "$selected"
          if [ "${#targets[@]}" -eq 0 ]; then
            echo "Heavy lane $HEAVY_LANE discovered no test items" >&2
            exit 1
          fi
          printf 'Heavy lane %s selected %s test items\n' "$HEAVY_LANE" "${#targets[@]}"
          uv run python -m pytest "${targets[@]}" -q -n auto --durations=25

  # The support lanes are independent of each other, so they run as parallel
  # jobs instead of serial steps inside one job (#1020): the web UI browser
  # acceptance used to serialize behind the python and voice lanes.
  supporting_tests:
    name: ci/tests (support, python)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          cache-suffix: ${{ github.job }}

      # Wheel/editable builds fail instead of substituting an older WebUI.
      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install workspace
        run: uv sync --all-packages --extra dev

      # These two tests have failed only under parallel load; keep them serial
      # until fixed (#470).
      - name: Run isolation-sensitive unit tests
        run: >-
          uv run python -m pytest -q
          tests/unit/test_hub_email_bridge.py::test_disconnect_ends_a_poll_blocked_in_idle
          tests/unit/test_relay_build_allowlist.py::test_packaged_relay_imports_and_help_from_allowlist_alone

      # The engine and rpc packages have their own tests that tests/unit never
      # collected, so engine changes merged without them.
      - name: Run engine and rpc package tests
        run: uv run python -m pytest -o asyncio_mode=auto packages/kollabor-engine/tests packages/kollabor-rpc/tests -q

      - name: Validate bundled Agent Skills layout
        run: uv run python scripts/validate_bundled_agent_skills.py

  # The voice package runs on its own 3.12/3.13 runtime and needs numpy,
  # which the workspace venv lacks, so tests/unit never collected it.
  # The LiveKit pins match the runtime in kollabor_voice/manifest.json;
  # without them test_livekit_worker.py skips itself (#403). uv fetches the
  # runtime itself (--no-project), so this lane needs no workspace install.
  support_voice_tests:
    name: ci/tests (support, voice)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          cache-suffix: ${{ github.job }}

      - name: Run voice package tests
        run: >-
          uv run --no-project --python 3.12 --with numpy==2.5.3
          --with pytest --with pytest-asyncio
          --with livekit==1.1.20 --with livekit-agents==1.8.8
          --with livekit-plugins-silero==1.8.8 --with onnxruntime==1.30.0
          --with livekit-local-inference==0.2.7
          python -m pytest packages/kollabor-voice/tests -q

  # The web UI's own tests never ran in CI: four vitest files and the
  # node:test files (Node 24 strips the types). Node-only lane: no python,
  # uv or workspace install.
  support_webui_tests:
    name: ci/tests (support, webui ${{ matrix.lane }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The browser suites fan out across four lane jobs so no single suite
        # bounds the run (#1022). Every lane runs its slice through the same
        # parallel runner; the core lane also owns the static web UI checks,
        # the runner unit tests, the controls inventory and the dist build
        # (team-launch needs the built frontend).
        lane: [core, learn, topics, notices]
        include:
          - lane: core
            suites: agent-sidebar,remote-chat-lifecycle,team-launch,profile-rows,profile-copy
          - lane: learn
            suites: learn,learn-loadouts
          - lane: topics
            suites: learn-topics
          - lane: notices
            suites: learn-notices,learn-retries

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: packages/kollabor-webui/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: packages/kollabor-webui/frontend
        run: npm ci --no-audit --no-fund

      - name: Run web UI tests
        if: matrix.lane == 'core'
        working-directory: packages/kollabor-webui/frontend
        run: |
          npx tsc --noEmit
          node scripts/check-test-discovery.mjs
          npx vitest run
          node --test $(grep -L 'from "vitest"' tests/*.test.ts)

      - name: Install Chromium for browser acceptance
        working-directory: packages/kollabor-webui/frontend
        run: npx playwright-core install --with-deps chromium

      # The runner supports 1-4 workers and every suite gets an isolated
      # HOME/TMPDIR and its own Chromium. KOLLAB_BROWSER_SUITES names this
      # lane's slice; the runner fails fast on an unknown name.
      - name: Run web UI browser acceptance
        working-directory: packages/kollabor-webui/frontend
        env:
          KOLLAB_BROWSER_WORKERS: "4"
          KOLLAB_BROWSER_SUITES: ${{ matrix.suites }}
          KOLLAB_BROWSER_RESULTS_DIR: ${{ runner.temp }}/kollab-browser-results
        run: |
          mkdir -p "$KOLLAB_BROWSER_RESULTS_DIR"
          if [ "${{ matrix.lane }}" = "core" ]; then
            npm run build
            npm run test:e2e:runner
            npm run inventory:controls -- "$KOLLAB_BROWSER_RESULTS_DIR/control-candidates.json"
          fi
          npm run test:e2e:parallel

      - name: Upload browser acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-acceptance-results-${{ matrix.lane }}
          path: ${{ runner.temp }}/kollab-browser-results
          if-no-files-found: ignore

  # Keep the exact required "ci/tests" check name expected by branch
  # protection. It succeeds only when every unit shard and the support job do.
  # !cancelled() makes the aggregate run after upstream failures or skips so
  # the required check cannot resolve green without all tests running.
  required_tests:
    # The job ID cannot contain '/' (GitHub id charset), but the DISPLAY name
    # is free-form: this resolves as the check "ci/tests", which is the exact
    # name the required rule expects.
    name: ci/tests
    needs: [tests, heavy_tests, supporting_tests, support_voice_tests, support_webui_tests]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every required test job passed
        env:
          UNIT_RESULT: ${{ needs.tests.result }}
          HEAVY_RESULT: ${{ needs.heavy_tests.result }}
          SUPPORT_PYTHON_RESULT: ${{ needs.supporting_tests.result }}
          SUPPORT_VOICE_RESULT: ${{ needs.support_voice_tests.result }}
          SUPPORT_WEBUI_RESULT: ${{ needs.support_webui_tests.result }}
        run: |
          case "$UNIT_RESULT:$HEAVY_RESULT:$SUPPORT_PYTHON_RESULT:$SUPPORT_VOICE_RESULT:$SUPPORT_WEBUI_RESULT" in
            success:success:success:success:success) echo "ci/tests: all required test jobs succeeded"; exit 0 ;;
            *) echo "ci/tests: unit shards '$UNIT_RESULT'; heavy '$HEAVY_RESULT'; support python '$SUPPORT_PYTHON_RESULT'; support voice '$SUPPORT_VOICE_RESULT'; support webui '$SUPPORT_WEBUI_RESULT'"; exit 1 ;;
          esac

  standards-check:
    name: ci/standards-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Depth 2 keeps the PR merge commit's parents, so the changelog check can diff against the base.
          fetch-depth: 2
          persist-credentials: false

      - uses: actions/setup-python@v6
        # launch runtime: standards checks gate on 3.14 (operator directive)
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          cache-suffix: ${{ github.job }}

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install workspace
        run: uv sync --all-packages --extra dev

      - name: Check syntax-critical lint rules
        run: uv run python -m ruff check --select E9,F63,F7,F82 kollabor packages plugins tests

      - name: Compile public entry points
        run: uv run python -m py_compile kollabor/cli.py kollabor_cli_main.py plugins/hub/plugin.py

      - name: Check release version parity
        # The engine, every workspace package, the web frontend bundle, and the
        # desktop Tauri config must sit at one release version. Drift fails the
        # PR here instead of surfacing as a false version-mismatch warning in
        # the web UI or a broken desktop release later.
        run: uv run python scripts/check_version_parity.py

      - name: Check changelog entries
        # Entries live in changes/<issue>.<section>.md, so two PRs never conflict on CHANGELOG.md
        # (#855). A PR may not edit either changelog copy unless its branch starts with release/
        # or changelog/. On a PR the checkout is the merge commit, so HEAD^1 is the base.
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            uv run python scripts/changelog.py check --diff-base HEAD^1 --branch "$HEAD_BRANCH"
          else
            uv run python scripts/changelog.py check
          fi

  security-scan:
    name: ci/security-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"

      - name: Run Gitleaks
        run: gitleaks detect --source . --redact --verbose

  # One quick Linux binary build per run: proves scripts/build_binary.py and
  # the packaging deps still work on every PR and main push, without paying
  # the full 4-platform + desktop matrix (that runs only for release tags,
  # via publish.yml -> binaries.yml).
  binary-smoke:
    name: ci/binary-smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          cache-suffix: ${{ github.job }}  # one cache per job, see ci.yml

      # build_binary.py verifies its own output before exiting: it runs the
      # binary with --version, kollab's imports and an HTTPS request.
      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Build the Linux binary and check that it runs
        env:
          # science, the scie builder pex runs, reads the Python Standalone Builds
          # release from the GitHub API; unauthenticated, runner IPs hit the rate limit.
          SCIENCE_AUTH_API_GITHUB_COM_BEARER: ${{ github.token }}
        run: python scripts/build_binary.py --out dist/bin
