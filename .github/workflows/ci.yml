name: CI

on:
  # integration/** too: lane PRs merge there first, and none may reach
  # Marco for approval without its own checks.
  pull_request:
    branches: [main, "release/**", "integration/**"]
  push:
    branches: [main, "release/**", "integration/**"]
  # A push performed with GITHUB_TOKEN cannot trigger another workflow. The
  # post-auto-merge gate uses this explicit event to run CI against main.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: ci/tests (unit shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.14 is the floor and the launch runtime.
        python-version: ["3.14"]
        shard: [0, 1, 2, 3]

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          # Matrix legs need separate caches; otherwise they race to save one key.
          cache-suffix: ${{ github.job }}-${{ matrix.shard }}

      # Wheel/editable builds fail instead of substituting an older WebUI.
      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install workspace
        run: uv sync --all-packages --extra dev

      # Hash test files across the matrix. Split the high-latency network
      # membership module by test item so one file can't dominate a shard.
      # Keep the two parallel-sensitive tests serial in the support job (#470).
      - name: Run unit test shard
        env:
          SHARD: ${{ matrix.shard }}
          SHARD_COUNT: ${{ strategy.job-total }}
        run: |
          set -euo pipefail
          selected_files=$(find tests/unit -type f -name 'test_*.py' -print |
            LC_ALL=C sort |
            python -c '
          import hashlib
          import os
          import sys

          shard = int(sys.argv[1])
          shard_count = int(sys.argv[2])
          for path in sys.stdin.buffer:
              path = path.rstrip(b"\n")
              if path == b"tests/unit/test_network_members.py":
                  continue
              digest = hashlib.sha256(b"kollab-ci-tests:" + path).digest()
              if int.from_bytes(digest[:4], "big") % shard_count == shard:
                  print(os.fsdecode(path))
          ' "$SHARD" "$SHARD_COUNT")
          test_files=()
          if [ -n "$selected_files" ]; then
            mapfile -t test_files <<< "$selected_files"
          fi

          network_tests=()
          if [ -f tests/unit/test_network_members.py ]; then
            selected_network_tests=$(
              uv run python -m pytest tests/unit/test_network_members.py --collect-only -q |
                python -c '
          import hashlib
          import os
          import sys

          shard = int(sys.argv[1])
          shard_count = int(sys.argv[2])
          prefix = b"tests/unit/test_network_members.py::"
          for nodeid in sys.stdin.buffer:
              nodeid = nodeid.rstrip(b"\n")
              if not nodeid.startswith(prefix):
                  continue
              digest = hashlib.sha256(b"kollab-ci-tests:" + nodeid).digest()
              if int.from_bytes(digest[:4], "big") % shard_count == shard:
                  print(os.fsdecode(nodeid))
          ' "$SHARD" "$SHARD_COUNT"
            )
            if [ -z "$selected_network_tests" ]; then
              echo "Network-membership shard $SHARD discovered no test items" >&2
              exit 1
            fi
            mapfile -t network_tests <<< "$selected_network_tests"
          fi

          test_targets=("${test_files[@]}" "${network_tests[@]}")
          if [ "${#test_targets[@]}" -eq 0 ]; then
            echo "Unit-test shard $SHARD discovered no test targets" >&2
            exit 1
          fi
          printf 'Shard %s selected %s files and %s network-membership test items\n' \
            "$SHARD" "${#test_files[@]}" "${#network_tests[@]}"
          uv run python -m pytest "${test_targets[@]}" -q -n auto \
            --deselect=tests/unit/test_hub_email_bridge.py::test_disconnect_ends_a_poll_blocked_in_idle \
            --deselect=tests/unit/test_relay_build_allowlist.py::test_packaged_relay_imports_and_help_from_allowlist_alone

  supporting_tests:
    name: ci/tests (support)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          cache-suffix: ${{ github.job }}

      # Wheel/editable builds fail instead of substituting an older WebUI.
      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install workspace
        run: uv sync --all-packages --extra dev

      # These two tests have failed only under parallel load; keep them serial
      # until fixed (#470).
      - name: Run isolation-sensitive unit tests
        run: >-
          uv run python -m pytest -q
          tests/unit/test_hub_email_bridge.py::test_disconnect_ends_a_poll_blocked_in_idle
          tests/unit/test_relay_build_allowlist.py::test_packaged_relay_imports_and_help_from_allowlist_alone

      # The engine and rpc packages have their own tests that tests/unit never
      # collected, so engine changes merged without them.
      - name: Run engine and rpc package tests
        run: uv run python -m pytest -o asyncio_mode=auto packages/kollabor-engine/tests packages/kollabor-rpc/tests -q

      # The voice package runs on its own 3.12/3.13 runtime and needs numpy,
      # which the workspace venv lacks, so tests/unit never collected it.
      # The LiveKit pins match the runtime in kollabor_voice/manifest.json;
      # without them test_livekit_worker.py skips itself (#403).
      - name: Run voice package tests
        run: >-
          uv run --no-project --python 3.12 --with numpy==2.5.3
          --with pytest --with pytest-asyncio
          --with livekit==1.1.20 --with livekit-agents==1.8.8
          --with livekit-plugins-silero==1.8.8 --with onnxruntime==1.30.0
          --with livekit-local-inference==0.2.7
          python -m pytest packages/kollabor-voice/tests -q

      # The web UI's own tests never ran in CI: four vitest files and the
      # node:test files (Node 24 strips the types).
      - name: Run web UI tests
        working-directory: packages/kollabor-webui/frontend
        run: |
          npm ci --no-audit --no-fund
          npx tsc --noEmit
          node scripts/check-test-discovery.mjs
          npx vitest run
          node --test $(grep -L 'from "vitest"' tests/*.test.ts)

      - name: Install Chromium for browser acceptance
        working-directory: packages/kollabor-webui/frontend
        run: npx playwright-core install --with-deps chromium

      - name: Run web UI browser acceptance
        working-directory: packages/kollabor-webui/frontend
        env:
          LEARN_CAPTURE_SCREENSHOTS: "0"
        run: |
          npm run test:e2e:learn
          npm run test:e2e:profile-rows

      - name: Validate bundled Agent Skills layout
        run: uv run python scripts/validate_bundled_agent_skills.py

  # Keep the exact required "ci/tests" check name expected by branch
  # protection. It succeeds only when every unit shard and the support job do.
  # !cancelled() makes the aggregate run after upstream failures or skips so
  # the required check cannot resolve green without all tests running.
  required_tests:
    # The job ID cannot contain '/' (GitHub id charset), but the DISPLAY name
    # is free-form: this resolves as the check "ci/tests", which is the exact
    # name the required rule expects.
    name: ci/tests
    needs: [tests, supporting_tests]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every required test job passed
        env:
          UNIT_RESULT: ${{ needs.tests.result }}
          SUPPORT_RESULT: ${{ needs.supporting_tests.result }}
        run: |
          case "$UNIT_RESULT:$SUPPORT_RESULT" in
            success:success) echo "ci/tests: all required test jobs succeeded"; exit 0 ;;
            *) echo "ci/tests: unit shards result '$UNIT_RESULT'; support result '$SUPPORT_RESULT'"; exit 1 ;;
          esac

  standards-check:
    name: ci/standards-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        # launch runtime: standards checks gate on 3.14 (operator directive)
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          cache-suffix: ${{ github.job }}

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install workspace
        run: uv sync --all-packages --extra dev

      - name: Check syntax-critical lint rules
        run: uv run python -m ruff check --select E9,F63,F7,F82 kollabor packages plugins tests

      - name: Compile public entry points
        run: uv run python -m py_compile kollabor/cli.py kollabor_cli_main.py plugins/hub/plugin.py

      - name: Check release version parity
        # The engine, every workspace package, the web frontend bundle, and the
        # desktop Tauri config must sit at one release version. Drift fails the
        # PR here instead of surfacing as a false version-mismatch warning in
        # the web UI or a broken desktop release later.
        run: uv run python scripts/check_version_parity.py

  security-scan:
    name: ci/security-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"

      - name: Run Gitleaks
        run: gitleaks detect --source . --redact --verbose

  # One quick Linux binary build per run: proves scripts/build_binary.py and
  # the packaging deps still work on every PR and main push, without paying
  # the full 4-platform + desktop matrix (that runs only for release tags,
  # via publish.yml -> binaries.yml).
  binary-smoke:
    name: ci/binary-smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          cache-suffix: ${{ github.job }}  # one cache per job, see ci.yml

      # build_binary.py verifies its own output before exiting: it runs the
      # binary with --version, kollab's imports and an HTTPS request.
      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Build the Linux binary and check that it runs
        env:
          # science, the scie builder pex runs, reads the Python Standalone Builds
          # release from the GitHub API; unauthenticated, runner IPs hit the rate limit.
          SCIENCE_AUTH_API_GITHUB_COM_BEARER: ${{ github.token }}
        run: python scripts/build_binary.py --out dist/bin
