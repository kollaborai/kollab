name: windows-smoke
on:
  workflow_dispatch:
jobs:
  presence-diagnostic:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v8.1.0
      - name: Install workspace
        run: uv sync --all-packages
      - name: Inspect real detached agent and engine
        run: uv run python scripts/issue466_windows_probe.py .venv/Scripts/kollab.exe
