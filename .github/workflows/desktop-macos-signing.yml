name: Desktop macOS packaging

"on":
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/desktop-macos-signing.yml
      - desktop/scripts/package-macos.sh
      - desktop/tests/test_apple_signing.py
      - desktop/docs/apple-signing.md
      - desktop/src-tauri/tauri.conf.json
  workflow_dispatch:
    inputs:
      mode:
        description: Unsigned needs no Apple account; developer-id signs, notarizes and staples
        type: choice
        options: [unsigned, developer-id]
        default: unsigned
      runtime_tag:
        description: Existing Kollab release whose verified CLI sidecar will be bundled
        type: string
        default: v0.16.1
        required: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - name: Check packaging contracts and shell syntax
        run: |
          python -m unittest discover -s desktop/tests -p 'test_apple_signing.py' -v
          bash -n desktop/scripts/package-macos.sh
          shellcheck desktop/scripts/package-macos.sh
          python -m json.tool desktop/src-tauri/tauri.conf.json > /dev/null

  package:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: aarch64
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            arch: x86_64
            target: x86_64-apple-darwin
    env:
      APPLE_ARTIFACT_DIR: ${{ github.workspace }}/desktop/dist
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Initialize isolated packaging paths
        shell: bash
        run: |
          printf 'APPLE_SIGNING_STATE_DIR=%s/kollab-apple-signing-%s-%s\n' "$RUNNER_TEMP" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
          printf 'CARGO_TARGET_DIR=%s/kollab-desktop-target\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Require main for Developer ID builds
        if: inputs.mode == 'developer-id' && github.ref != 'refs/heads/main'
        run: |
          echo 'Developer ID packaging is permitted only from main.' >&2
          exit 1
      - name: Check explicit signing and notarization secrets
        if: inputs.mode == 'developer-id' && github.ref == 'refs/heads/main'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: bash desktop/scripts/package-macos.sh preflight developer-id
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install the Tauri 2 CLI
        run: cargo install tauri-cli --version '^2' --locked
      - name: Download and verify the existing release sidecar
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUNTIME_TAG: ${{ inputs.runtime_tag }}
          ARCH: ${{ matrix.arch }}
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RUNTIME_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]] || { echo 'Expected an existing version tag.' >&2; exit 1; }
          download="$RUNNER_TEMP/kollab-sidecar"
          mkdir "$download"
          gh release download "$RUNTIME_TAG" --dir "$download" \
            --pattern "kollab-macos-$ARCH" --pattern "kollab-macos-$ARCH.sha256"
          (cd "$download" && shasum -a 256 -c "kollab-macos-$ARCH.sha256")
          mkdir -p desktop/src-tauri/binaries
          cp "$download/kollab-macos-$ARCH" "desktop/src-tauri/binaries/kollab-$TARGET"
          chmod +x "desktop/src-tauri/binaries/kollab-$TARGET"
      - name: Package unsigned without Apple credentials
        if: inputs.mode == 'unsigned'
        env:
          TARGET: ${{ matrix.target }}
        run: bash desktop/scripts/package-macos.sh package unsigned "$TARGET"
      - name: Sign, notarize, staple and validate Kollab.app
        if: inputs.mode == 'developer-id' && github.ref == 'refs/heads/main'
        env:
          TARGET: ${{ matrix.target }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: bash desktop/scripts/package-macos.sh package developer-id "$TARGET"
      - name: Retry cleanup of only this job's temporary keychain
        if: always()
        run: bash desktop/scripts/package-macos.sh cleanup
      - uses: actions/upload-artifact@v7
        with:
          name: Kollab-macos-${{ matrix.arch }}-${{ inputs.mode }}
          path: |
            desktop/dist/Kollab-macos-${{ matrix.arch }}-${{ inputs.mode }}.zip
            desktop/dist/Kollab-macos-${{ matrix.arch }}-${{ inputs.mode }}.zip.sha256
          if-no-files-found: error
