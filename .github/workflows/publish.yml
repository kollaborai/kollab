name: Publish release

# Run the reviewed controller on main; an existing release tag selects source.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated release tag (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-release
  cancel-in-progress: false
  queue: max

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.source.outputs.tag }}
      version: ${{ steps.source.outputs.version }}
      source_sha: ${{ steps.source.outputs.source_sha }}
      tag_object: ${{ steps.source.outputs.tag_object }}
      controller_sha: ${{ steps.source.outputs.controller_sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - name: Resolve reviewed source and immutable tag object
        id: source
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          WORKFLOW_REF: ${{ github.ref }}
          CONTROLLER_SHA: ${{ github.sha }}
        run: python scripts/release_publish.py source --tag "$RELEASE_TAG" --workflow-ref "$WORKFLOW_REF" --controller "$CONTROLLER_SHA" --output "$GITHUB_OUTPUT"

  source-validation:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - name: Check tagged versions and changelog copies
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          python scripts/check_version_parity.py --expected "$RELEASE_TAG"
          cmp CHANGELOG.md kollabor/updates/CHANGELOG.md

  binaries:
    needs: [validate, source-validation]
    uses: ./.github/workflows/binaries.yml
    with:
      version: ${{ needs.validate.outputs.tag }}
      source_ref: ${{ needs.validate.outputs.source_sha }}

  build-packages:
    needs: [validate, binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: frontend-dist
          path: ${{ runner.temp }}/kollab-frontend
      - name: Build ten packages from the exact tag with the selected frontend
        env:
          KOLLAB_FRONTEND_DIST: ${{ runner.temp }}/kollab-frontend
        run: |
          for pkg in kollabor-events kollabor-ai kollabor-rpc kollabor-config kollabor-plugins kollabor-tui kollabor-agent kollabor-engine kollabor-webui; do
            uv build --package "$pkg" --out-dir "$RUNNER_TEMP/pypi-dist"
          done
          uv build --out-dir "$RUNNER_TEMP/pypi-dist"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pypi-distributions
          path: ${{ runner.temp }}/pypi-dist/*
          if-no-files-found: error

  publish-packages:
    needs: [validate, build-packages]
    runs-on: ubuntu-latest
    environment:
      name: pypi-publish
      url: https://pypi.org/project/kollab/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate.outputs.controller_sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: pypi-distributions
          path: dist
      - name: Verify all package metadata, existing digests and tag identity
        id: plan
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
          TAG_OBJECT: ${{ needs.validate.outputs.tag_object }}
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release_publish.py plan-pypi --tag "$RELEASE_TAG" --source "$SOURCE_SHA" --tag-object "$TAG_OBJECT" --dist dist --upload upload --output "$GITHUB_OUTPUT"
      - name: Publish workspace packages with PyPI trusted publishing
        if: steps.plan.outputs.workspace_count != '0'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: upload/workspace/
      - name: Verify workspace publication before exposing the root package
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: python scripts/release_publish.py verify-pypi --tag "$RELEASE_TAG" --dist dist --workspace-only
      - name: Publish kollab after its dependencies
        if: steps.plan.outputs.root_count != '0'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: upload/root/
      - name: Verify the complete published package set
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: python scripts/release_publish.py verify-pypi --tag "$RELEASE_TAG" --dist dist

  release:
    needs: [validate, binaries, publish-packages]
    runs-on: ubuntu-latest
    environment: github-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate.outputs.controller_sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: kollab-*
          path: dist/bin
          merge-multiple: true
      - name: Publish a complete draft without replacing existing assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
          TAG_OBJECT: ${{ needs.validate.outputs.tag_object }}
        run: python scripts/release_publish.py github --tag "$RELEASE_TAG" --source "$SOURCE_SHA" --tag-object "$TAG_OBJECT" --dist dist/bin
