# Dependabot version updates (#1519). Option reference:
# https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference
#
# Each entry groups minor and patch updates into one PR. Majors get their own PR.
# Open version-update PRs are capped at 3 per entry, and a release waits 7 days
# (cooldown) before Dependabot proposes it. Security updates are not delayed.
#
# Not listed:
# - pip at "/" and pip for /packages/*: the uv entry owns pyproject.toml and uv.lock,
#   and every packages/kollabor-* package is a uv workspace member in that lock.
# - npm at "/": the root package.json has no dependencies and no lockfile.
# - pre-commit: .pre-commit-config.yaml has only local hooks.
#
# cargo and docker run monthly: no PR workflow builds the desktop crate or the
# Docker images, so those PRs need a local build before they merge.

version: 2

updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      uv-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # scripts/relay/requirements.txt is generated by `uv pip compile` from requirements.in.
  - package-ecosystem: "pip"
    directories:
      - "/scripts/discovery"
      - "/scripts/relay"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      pip-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/packages/kollabor-webui/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # These PRs change .github/workflows, which the merge bot leaves to the integrator.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "cargo"
    directory: "/desktop/src-tauri"
    schedule:
      interval: "monthly"
      time: "09:00"
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      cargo-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/tests/docker/kill_switch"
    schedule:
      interval: "monthly"
      time: "09:00"
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      docker-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
