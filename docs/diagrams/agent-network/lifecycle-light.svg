<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 414" width="1000" height="414" role="img" aria-label="Daemon lifecycle: plain kollab opens a window plus daemon, Ctrl+Z or a closed terminal leaves the daemon running, kollab -d starts it headless, kollab service install has systemd or launchd bring it back after a crash or reboot, and without a service Ctrl+C twice or a reboot stops it until kollab runs again in the same folder."><title>Daemon lifecycle: plain kollab opens a window plus daemon, Ctrl+Z or a closed terminal leaves the daemon running, kollab -d starts it headless, kollab service install has systemd or launchd bring it back after a crash or reboot, and without a service Ctrl+C twice or a reboot stops it until kollab runs again in the same folder.</title><style>svg{--bg:#F6F8FB;--panel:#EAEFF5;--line:#CDD4DD;--fg:#191E26;--dim:#5C6674;--you:#C65220;--seal:#1A703A;--agent:#304EA8;--warn:#94581A;--body:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;--mono:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;--display:var(--mono)} text { fill: var(--fg); font-family: var(--body); } .m { font-family: var(--mono); } .d { font-family: var(--display); letter-spacing: .08em; } .dimf { fill: var(--dim); } .youf { fill: var(--you); } .sealf { fill: var(--seal); } .agentf { fill: var(--agent); } .warnf { fill: var(--warn); } .numf { fill: var(--fg); } .fpanel { fill: var(--panel); } .fbg { fill: var(--bg); } .fseal { fill: var(--seal); } .ln { stroke: var(--fg); stroke-width: 1.3; } .sline { stroke: var(--line); stroke-width: 1.2; } .lnline { stroke: var(--line); stroke-width: 1.5; } .lndim { stroke: var(--dim); stroke-width: 1.3; } .lnyou { stroke: var(--you); stroke-width: 1.4; } .lnseal { stroke: var(--seal); stroke-width: 1.4; } .lnagent { stroke: var(--agent); stroke-width: 1.4; } .lnwarn { stroke: var(--warn); stroke-width: 1.4; } .med { stroke-width: 1.7; } .thick { stroke-width: 2.2; } .dash { stroke-dasharray: 7 6; } .mk { fill: var(--fg); } .mk-seal { fill: var(--seal); } .mk-agent { fill: var(--agent); } .mk-dim { fill: var(--dim); } .mk-warn { fill: var(--warn); }</style><rect width="1000" height="414" rx="14" fill="#F6F8FB"/><defs><marker id="f4-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="mk"/></marker><marker id="f4-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="mk-seal"/></marker><marker id="f4-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="mk-agent"/></marker><marker id="f4-d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="mk-dim"/></marker><marker id="f4-w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="mk-warn"/></marker></defs><rect x="40" y="170" width="230" height="72" rx="12" class="fpanel ln thick" /><text x="155" y="195" font-size="14" text-anchor="middle" font-weight="700">window + daemon</text><circle cx="125" cy="210" r="4.5" class="fseal"/><text x="135" y="214" class="m sealf" font-size="12" font-weight="700">online</text><text x="155" y="232" class="dimf" font-size="11.5" text-anchor="middle">you're in the TUI</text><rect x="385" y="170" width="230" height="72" rx="12" class="fpanel ln thick" /><text x="500" y="195" font-size="14" text-anchor="middle" font-weight="700">daemon only</text><circle cx="470" cy="210" r="4.5" class="fseal"/><text x="480" y="214" class="m sealf" font-size="12" font-weight="700">online</text><text x="500" y="232" class="dimf" font-size="11.5" text-anchor="middle">no window, SSH can close</text><rect x="730" y="170" width="230" height="72" rx="12" class="fpanel ln thick" /><text x="845" y="195" font-size="14" text-anchor="middle" font-weight="700">no daemon</text><circle cx="815" cy="210" r="4.5" class="fbg ln"/><text x="825" y="214" class="m dimf" font-size="12" font-weight="700">offline</text><text x="845" y="232" class="dimf" font-size="11.5" text-anchor="middle">peers list it as offline</text><path d="M 235 170 Q 327 112 420 170" class="ln med" fill="none" marker-end="url(#f4-a)"/><text x="327" y="120" class="m" font-size="12.5" text-anchor="middle" font-weight="700">Ctrl+Z</text><text x="327" y="134" class="dimf" font-size="11.5" text-anchor="middle">terminal closes · SSH drops</text><path d="M 580 170 Q 672 112 765 170" class="lnwarn med dash" fill="none" marker-end="url(#f4-w)"/><text x="672" y="120" class="m warnf" font-size="12.5" text-anchor="middle" font-weight="700">reboot, no service</text><text x="672" y="134" class="m dimf" font-size="11.5" text-anchor="middle">kollab --hub stop &lt;name&gt;</text><path d="M 845 170 C 845 40 155 40 155 170" class="lnyou med" fill="none" marker-end="url(#f4-a)"/><text x="500" y="42" class="m youf" font-size="12.5" text-anchor="middle" font-weight="700">kollab   (in the device's folder)</text><text x="500" y="59" class="dimf" font-size="11.5" text-anchor="middle">reconnects on its own · same device · no new code</text><path d="M 420 242 Q 327 300 235 242" class="ln med" fill="none" marker-end="url(#f4-a)"/><text x="327" y="292" class="m" font-size="12.5" text-anchor="middle" font-weight="700">kollab in that folder</text><text x="327" y="307" class="m dimf" font-size="11.5" text-anchor="middle">or kollab --attach &lt;name&gt;</text><path d="M 765 242 Q 672 300 580 242" class="lnyou med" fill="none" marker-end="url(#f4-a)"/><text x="672" y="292" class="m youf" font-size="12.5" text-anchor="middle" font-weight="700">kollab -d</text><text x="672" y="307" class="dimf" font-size="11.5" text-anchor="middle">headless, no window</text><path d="M 155 242 C 155 400 845 400 845 242" class="lnwarn med dash" fill="none" marker-end="url(#f4-w)"/><text x="500" y="386" class="m warnf" font-size="12.5" text-anchor="middle" font-weight="700">Ctrl+C twice in a window opened by plain kollab</text><text x="500" y="402" class="dimf" font-size="11.5" text-anchor="middle">or a reboot without kollab service</text><path d="M 470 242 C 446 334 554 334 530 242" class="lnseal med" fill="none" marker-end="url(#f4-s)"/><text x="500" y="334" class="m sealf" font-size="12.5" text-anchor="middle" font-weight="700">kollab service install</text><text x="500" y="350" class="dimf" font-size="11.5" text-anchor="middle">crash or reboot: back in 5 s</text></svg>
