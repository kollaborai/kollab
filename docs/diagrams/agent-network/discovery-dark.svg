<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 632" width="1000" height="632" role="img" aria-label="How /connect uses your domain: the device reads the _agent TXT record, which only points at the key file; it fetches the signed key file over HTTPS, checks the signature, domain and expiry, pins the key, and dials the relay the file names. kollab relay serve re-signs the file every 60 seconds and drops the relay from it on stop."><title>How /connect uses your domain: the device reads the _agent TXT record, which only points at the key file; it fetches the signed key file over HTTPS, checks the signature, domain and expiry, pins the key, and dials the relay the file names. kollab relay serve re-signs the file every 60 seconds and drops the relay from it on stop.</title><style>svg{--bg:#121416;--panel:#191C20;--line:#2C323A;--fg:#ECF0F4;--dim:#9199A4;--you:#F86C2B;--seal:#60BE78;--agent:#91AAFF;--warn:#E0983E;--body:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;--mono:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;--display:var(--mono)} text { fill: var(--fg); font-family: var(--body); } .m { font-family: var(--mono); } .d { font-family: var(--display); letter-spacing: .08em; } .dimf { fill: var(--dim); } .youf { fill: var(--you); } .sealf { fill: var(--seal); } .agentf { fill: var(--agent); } .warnf { fill: var(--warn); } .numf { fill: var(--fg); } .fpanel { fill: var(--panel); } .fbg { fill: var(--bg); } .fseal { fill: var(--seal); } .ln { stroke: var(--fg); stroke-width: 1.3; } .sline { stroke: var(--line); stroke-width: 1.2; } .lnline { stroke: var(--line); stroke-width: 1.5; } .lndim { stroke: var(--dim); stroke-width: 1.3; } .lnyou { stroke: var(--you); stroke-width: 1.4; } .lnseal { stroke: var(--seal); stroke-width: 1.4; } .lnagent { stroke: var(--agent); stroke-width: 1.4; } .lnwarn { stroke: var(--warn); stroke-width: 1.4; } .med { stroke-width: 1.7; } .thick { stroke-width: 2.2; } .dash { stroke-dasharray: 7 6; } .mk { fill: var(--fg); } .mk-seal { fill: var(--seal); } .mk-agent { fill: var(--agent); } .mk-dim { fill: var(--dim); } .mk-warn { fill: var(--warn); }</style><rect width="1000" height="632" rx="14" fill="#121416"/><defs><marker id="f7-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="mk"/></marker><marker id="f7-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="mk-seal"/></marker><marker id="f7-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="mk-agent"/></marker><marker id="f7-d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="mk-dim"/></marker><marker id="f7-w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="mk-warn"/></marker></defs><rect x="18" y="14" width="184" height="54" rx="10" class="fpanel ln" /><text x="110" y="37" font-size="14" text-anchor="middle" font-weight="700">Your device</text><text x="110" y="55" class="m dimf" font-size="11" text-anchor="middle">/connect &lt;domain&gt;</text><rect x="238" y="14" width="184" height="54" rx="10" class="fpanel ln" /><text x="330" y="37" font-size="14" text-anchor="middle" font-weight="700">DNS</text><text x="330" y="55" class="m dimf" font-size="11" text-anchor="middle">at your registrar</text><rect x="458" y="14" width="184" height="54" rx="10" class="fpanel ln" /><text x="550" y="37" font-size="14" text-anchor="middle" font-weight="700">agents.example.com</text><text x="550" y="55" class="m dimf" font-size="11" text-anchor="middle">kollab relay serve</text><text x="664" y="37" font-size="14" font-weight="700">What it means</text><text x="664" y="55" class="m dimf" font-size="11">dashed = an answer</text><rect x="0" y="84" width="1000" height="26" rx="0" class="fpanel" /><text x="16" y="101" class="d dimf" font-size="11">YOUR DEVICE RUNS /CONNECT AGENTS.EXAMPLE.COM</text><rect x="0" y="480" width="1000" height="26" rx="0" class="fpanel" /><text x="16" y="497" class="d dimf" font-size="11">MEANWHILE · ON YOUR SERVER</text><line x1="110" y1="68" x2="110" y2="628" class="lnline lifeline" /><line x1="330" y1="68" x2="330" y2="628" class="lnline lifeline" /><line x1="550" y1="68" x2="550" y2="628" class="lnline lifeline" /><line x1="110" y1="136" x2="322" y2="136" class="ln med" marker-end="url(#f7-a)"/><text x="220.0" y="129" class="m" font-size="12" text-anchor="middle">TXT _agent.&lt;domain&gt;</text><circle cx="674" cy="125" r="10" class="fbg ln"/><text x="674" y="129" class="m numf" font-size="11" text-anchor="middle" font-weight="700">1</text><text x="692" y="129" font-size="12.5">The device asks DNS where the key file is.</text><text x="692" y="145" font-size="12.5">One lookup, 5 s.</text><line x1="330" y1="184" x2="118" y2="184" class="ln med" marker-end="url(#f7-a)" stroke-dasharray="6 5"/><text x="220.0" y="177" class="m" font-size="12" text-anchor="middle">v=aid1;u=https://…</text><circle cx="674" cy="173" r="10" class="fbg ln"/><text x="674" y="177" class="m numf" font-size="11" text-anchor="middle" font-weight="700">2</text><text x="692" y="177" font-size="12.5">A pointer, not proof: HTTPS on the same</text><text x="692" y="193" font-size="12.5">domain. No record? It tries that URL anyway.</text><line x1="110" y1="232" x2="542" y2="232" class="ln med" marker-end="url(#f7-a)"/><text x="330.0" y="225" class="m" font-size="12" text-anchor="middle">GET /.well-known/agent-keys.json</text><circle cx="674" cy="221" r="10" class="fbg ln"/><text x="674" y="225" class="m numf" font-size="11" text-anchor="middle" font-weight="700">3</text><text x="692" y="225" font-size="12.5">Real certificate, public address only (unless</text><text x="692" y="241" font-size="12.5">you allow a private range). 64 KiB, 10 s.</text><line x1="550" y1="280" x2="118" y2="280" class="lnseal med" marker-end="url(#f7-s)" stroke-dasharray="6 5"/><text x="330.0" y="273" class="m" font-size="12" text-anchor="middle">signed key file · revision N</text><circle cx="674" cy="269" r="10" class="fbg lnseal"/><text x="674" y="273" class="m numf" font-size="11" text-anchor="middle" font-weight="700">4</text><text x="692" y="273" font-size="12.5">Its Ed25519 key, the relay URL and roles, a</text><text x="692" y="289" font-size="12.5">revision, an expiry 5 min after signing.</text><path d="M 110 318 H 146 V 336 H 118" class="lnseal med" fill="none" marker-end="url(#f7-s)"/><text x="154" y="332" class="m sealf" font-size="12" text-anchor="start" font-weight="600">check</text><circle cx="674" cy="317" r="10" class="fbg lnseal"/><text x="674" y="321" class="m numf" font-size="11" text-anchor="middle" font-weight="700">5</text><text x="692" y="321" font-size="12.5">Signed by the key inside it, for this domain,</text><text x="692" y="337" font-size="12.5">not expired. Anything else stops here.</text><path d="M 110 366 H 146 V 384 H 118" class="lnseal med" fill="none" marker-end="url(#f7-s)"/><text x="154" y="380" class="m sealf" font-size="12" text-anchor="start" font-weight="600">pin</text><circle cx="674" cy="365" r="10" class="fbg lnseal"/><text x="674" y="369" class="m numf" font-size="11" text-anchor="middle" font-weight="700">6</text><text x="692" y="369" font-size="12.5">First sight: kept as the pin. Later a new key</text><text x="692" y="385" font-size="12.5">is key_changed, an older revision rollback.</text><line x1="110" y1="424" x2="542" y2="424" class="ln thick" marker-end="url(#f7-a)"/><text x="330.0" y="417" class="m" font-size="12" text-anchor="middle">wss /relay/v1/ws</text><circle cx="674" cy="413" r="10" class="fbg ln"/><text x="674" y="417" class="m numf" font-size="11" text-anchor="middle" font-weight="700">7</text><text x="692" y="417" font-size="12.5">Only if the file names a ready relay. Then</text><text x="692" y="433" font-size="12.5">join codes work exactly as on kollabor.ai.</text><path d="M 550 522 H 514 V 540 H 542" class="lnseal med" fill="none" marker-end="url(#f7-s)"/><text x="506" y="536" class="m sealf" font-size="12" text-anchor="end" font-weight="600">re-sign every 60 s</text><circle cx="674" cy="521" r="10" class="fbg lnseal"/><text x="674" y="525" class="m numf" font-size="11" text-anchor="middle" font-weight="700">8</text><text x="692" y="525" font-size="12.5">kollab relay serve signs revision N+1. It</text><text x="692" y="541" font-size="12.5">names the relay only while the relay is ready.</text><path d="M 550 570 H 514 V 588 H 542" class="lnwarn med" fill="none" marker-end="url(#f7-w)"/><text x="506" y="584" class="m warnf" font-size="12" text-anchor="end" font-weight="600">on stop</text><circle cx="674" cy="569" r="10" class="fbg lnwarn"/><text x="674" y="573" class="m numf" font-size="11" text-anchor="middle" font-weight="700">9</text><text x="692" y="573" font-size="12.5">One last file, without the relay. Lose</text><text x="692" y="589" font-size="12.5">service.key and pinned devices refuse you.</text></svg>
