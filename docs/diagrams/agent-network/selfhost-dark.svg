<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 356" width="1000" height="356" role="img" aria-label="One-command directory: devices reach your TLS proxy on 443, which forwards five routes to kollab relay serve on 127.0.0.1:9078; one process runs the relay, the publisher and the key file; the state directory holds the signing key; you add a DNS TXT record, and --install keeps it running as a systemd service."><title>One-command directory: devices reach your TLS proxy on 443, which forwards five routes to kollab relay serve on 127.0.0.1:9078; one process runs the relay, the publisher and the key file; the state directory holds the signing key; you add a DNS TXT record, and --install keeps it running as a systemd service.</title><style>svg{--bg:#121416;--panel:#191C20;--line:#2C323A;--fg:#ECF0F4;--dim:#9199A4;--you:#F86C2B;--seal:#60BE78;--agent:#91AAFF;--warn:#E0983E;--body:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;--mono:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;--display:var(--mono)} text { fill: var(--fg); font-family: var(--body); } .m { font-family: var(--mono); } .d { font-family: var(--display); letter-spacing: .08em; } .dimf { fill: var(--dim); } .youf { fill: var(--you); } .sealf { fill: var(--seal); } .agentf { fill: var(--agent); } .warnf { fill: var(--warn); } .numf { fill: var(--fg); } .fpanel { fill: var(--panel); } .fbg { fill: var(--bg); } .fseal { fill: var(--seal); } .ln { stroke: var(--fg); stroke-width: 1.3; } .sline { stroke: var(--line); stroke-width: 1.2; } .lnline { stroke: var(--line); stroke-width: 1.5; } .lndim { stroke: var(--dim); stroke-width: 1.3; } .lnyou { stroke: var(--you); stroke-width: 1.4; } .lnseal { stroke: var(--seal); stroke-width: 1.4; } .lnagent { stroke: var(--agent); stroke-width: 1.4; } .lnwarn { stroke: var(--warn); stroke-width: 1.4; } .med { stroke-width: 1.7; } .thick { stroke-width: 2.2; } .dash { stroke-dasharray: 7 6; } .mk { fill: var(--fg); } .mk-seal { fill: var(--seal); } .mk-agent { fill: var(--agent); } .mk-dim { fill: var(--dim); } .mk-warn { fill: var(--warn); }</style><rect width="1000" height="356" rx="14" fill="#121416"/><defs><marker id="f5-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="mk"/></marker><marker id="f5-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="mk-seal"/></marker><marker id="f5-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="mk-agent"/></marker><marker id="f5-d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="mk-dim"/></marker><marker id="f5-w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="mk-warn"/></marker></defs><rect x="16" y="96" width="130" height="72" rx="10" class="fbg ln" /><text x="81" y="120" font-size="13" text-anchor="middle" font-weight="700">your devices</text><text x="81" y="138" class="m dimf" font-size="11" text-anchor="middle">/connect</text><text x="81" y="154" class="m dimf" font-size="10" text-anchor="middle">agents.example.com</text><rect x="16" y="218" width="176" height="118" rx="10" class="fbg ln" /><text x="30" y="240" font-size="12" font-weight="700">DNS, at your registrar</text><text x="30" y="260" class="m dimf" font-size="10">_agent.agents.example.com</text><text x="30" y="275" class="m dimf" font-size="10">TXT "v=aid1;u=https://</text><text x="30" y="290" class="m dimf" font-size="10">agents.example.com/</text><text x="30" y="305" class="m dimf" font-size="10">.well-known/</text><text x="30" y="320" class="m dimf" font-size="10">agent-keys.json"</text><line x1="81" y1="168" x2="81" y2="216" class="lndim" stroke-dasharray="2 4" marker-end="url(#f5-d)"/><text x="89" y="197" class="m dimf" font-size="10.5">TXT lookup</text><rect x="210" y="30" width="770" height="316" rx="14" class="fpanel sline" /><text x="230" y="56" font-size="14" font-weight="700">your server · agents.example.com</text><rect x="230" y="72" width="238" height="258" rx="10" class="fbg ln thick" /><text x="246" y="94" font-size="13" font-weight="700">TLS proxy :443</text><text x="246" y="110" class="dimf" font-size="11">nginx or Caddy, your cert</text><text x="246" y="138" class="m" font-size="10.5">GET  /.well-known/agent-keys.json</text><text x="246" y="157" class="m" font-size="10.5">GET  /relay/v1/health</text><text x="246" y="176" class="m" font-size="10.5">WS   /relay/v1/ws</text><text x="246" y="195" class="m" font-size="10.5">POST /relay/v1/enrollment/*</text><text x="246" y="246" class="m warnf" font-size="10.5" font-weight="700">never: /relay/v1/metrics</text><text x="246" y="272" class="m dimf" font-size="10.5">--print nginx | caddy</text><text x="246" y="290" class="dimf" font-size="11">writes the config for you</text><line x1="146" y1="132" x2="228" y2="132" class="ln thick" marker-end="url(#f5-a)"/><text x="177" y="124" class="m dimf" font-size="10" text-anchor="middle">wss</text><text x="177" y="148" class="m dimf" font-size="10" text-anchor="middle">HTTPS</text><line x1="468" y1="186" x2="538" y2="186" class="ln med" marker-end="url(#f5-a)"/><text x="503" y="178" class="m dimf" font-size="10.5" text-anchor="middle">127.0.0.1</text><text x="503" y="202" class="m dimf" font-size="10.5" text-anchor="middle">:9078</text><rect x="540" y="72" width="260" height="258" rx="10" class="fbg ln thick" /><text x="556" y="94" class="m" font-size="12.5" font-weight="700">kollab relay serve</text><text x="556" y="110" class="m dimf" font-size="10.5">--domain agents.example.com</text><rect x="556" y="124" width="228" height="54" rx="8" class="fpanel sline" /><text x="570" y="146" font-size="12.5" font-weight="700">relay worker</text><text x="570" y="164" class="dimf" font-size="11">one, in memory: rooms, mailbox</text><rect x="556" y="190" width="228" height="54" rx="8" class="fpanel sline" /><text x="570" y="212" font-size="12.5" font-weight="700">publisher</text><text x="570" y="230" class="dimf" font-size="11">re-signs the key file every 60 s</text><rect x="556" y="256" width="228" height="54" rx="8" class="fpanel sline" /><text x="570" y="278" font-size="12.5" font-weight="700">key file</text><text x="570" y="296" class="dimf" font-size="11">served on the same port</text><rect x="820" y="72" width="146" height="128" rx="10" class="fbg ln" /><text x="834" y="94" font-size="12" font-weight="700">state directory</text><text x="834" y="114" class="m dimf" font-size="10">~/.kollab/relay/</text><text x="834" y="130" class="m dimf" font-size="10">agents.example.com/</text><text x="834" y="146" class="m dimf" font-size="10">service.key  0600</text><text x="834" y="162" class="m dimf" font-size="10">publisher.json</text><text x="834" y="188" class="warnf" font-size="11.5" font-weight="700">back this up</text><line x1="800" y1="136" x2="818" y2="136" class="ln" marker-end="url(#f5-a)"/><rect x="820" y="214" width="146" height="116" rx="10" class="fbg ln" /><text x="834" y="236" font-size="12" font-weight="700">systemd unit</text><text x="834" y="256" class="m youf" font-size="10.5" font-weight="700">--install</text><text x="834" y="276" class="dimf" font-size="11">writes, enables and</text><text x="834" y="292" class="dimf" font-size="11">starts it (sudo)</text><text x="834" y="312" class="m dimf" font-size="10.5">or --print systemd</text><line x1="818" y1="270" x2="802" y2="270" class="ln" marker-end="url(#f5-a)"/></svg>
