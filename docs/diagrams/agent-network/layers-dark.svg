<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 392" width="1000" height="392" role="img" aria-label="One connection, five layers: the wss link and relay frame are visible to kollabor.ai; the NaCl Box, the mutual TLS 1.3 session and the hub message inside are readable only by your two daemons."><title>One connection, five layers: the wss link and relay frame are visible to kollabor.ai; the NaCl Box, the mutual TLS 1.3 session and the hub message inside are readable only by your two daemons.</title><style>svg{--bg:#121416;--panel:#191C20;--line:#2C323A;--fg:#ECF0F4;--dim:#9199A4;--you:#F86C2B;--seal:#60BE78;--agent:#91AAFF;--warn:#E0983E;--body:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;--mono:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;--display:var(--mono)} text { fill: var(--fg); font-family: var(--body); } .m { font-family: var(--mono); } .d { font-family: var(--display); letter-spacing: .08em; } .dimf { fill: var(--dim); } .youf { fill: var(--you); } .sealf { fill: var(--seal); } .agentf { fill: var(--agent); } .warnf { fill: var(--warn); } .numf { fill: var(--fg); } .fpanel { fill: var(--panel); } .fbg { fill: var(--bg); } .fseal { fill: var(--seal); } .ln { stroke: var(--fg); stroke-width: 1.3; } .sline { stroke: var(--line); stroke-width: 1.2; } .lnline { stroke: var(--line); stroke-width: 1.5; } .lndim { stroke: var(--dim); stroke-width: 1.3; } .lnyou { stroke: var(--you); stroke-width: 1.4; } .lnseal { stroke: var(--seal); stroke-width: 1.4; } .lnagent { stroke: var(--agent); stroke-width: 1.4; } .lnwarn { stroke: var(--warn); stroke-width: 1.4; } .med { stroke-width: 1.7; } .thick { stroke-width: 2.2; } .dash { stroke-dasharray: 7 6; } .mk { fill: var(--fg); } .mk-seal { fill: var(--seal); } .mk-agent { fill: var(--agent); } .mk-dim { fill: var(--dim); } .mk-warn { fill: var(--warn); }</style><rect width="1000" height="392" rx="14" fill="#121416"/><rect x="20" y="24" width="680" height="352" rx="12" class="fpanel ln" /><text x="36" y="50" class="m numf" font-size="13" font-weight="700">1</text><text x="54" y="50" class="m" font-size="12.5">wss://kollabor.ai/relay/v1/ws</text><text x="684" y="50" class="m dimf" font-size="11.5" text-anchor="end">TLS, ends at the proxy</text><rect x="44" y="66" width="632" height="296" rx="12" class="fbg ln" /><text x="60" y="92" class="m numf" font-size="13" font-weight="700">2</text><text x="78" y="92" class="m" font-size="12.5">relay frame {type:"send", to:&lt;VPS key&gt;, ciphertext}</text><rect x="68" y="108" width="584" height="240" rx="12" class="fpanel lnseal thick" /><text x="84" y="134" class="m sealf" font-size="13" font-weight="700">3</text><text x="102" y="134" class="m" font-size="12.5">NaCl Box · keys from both devices</text><text x="636" y="134" class="m dimf" font-size="11.5" text-anchor="end">30 s expiry</text><rect x="92" y="150" width="536" height="184" rx="12" class="fbg lnseal thick" /><text x="108" y="176" class="m sealf" font-size="13" font-weight="700">4</text><text x="126" y="176" class="m" font-size="12.5">mutual TLS 1.3 · pinned device certs</text><text x="612" y="176" class="m dimf" font-size="11.5" text-anchor="end">kollab-agent/1</text><rect x="116" y="192" width="488" height="128" rx="12" class="fpanel lnagent thick" /><text x="132" y="218" class="m agentf" font-size="13" font-weight="700">5</text><text x="150" y="218" class="m" font-size="12.5">hub message</text><text x="150" y="248" class="m dimf" font-size="12">to:</text><text x="204" y="248" class="m" font-size="12">infra@vps-home</text><text x="150" y="268" class="m dimf" font-size="12">from:</text><text x="204" y="268" class="m" font-size="12">lapis@macbook-kollab</text><text x="150" y="288" class="m dimf" font-size="12">text:</text><text x="204" y="288" class="m" font-size="12">"check the wireguard tunnel…"  ≤16 KB</text><path d="M 716 30 H 722 V 102 H 716" class="ln" fill="none" /><text x="736" y="50" font-size="13" font-weight="700">kollabor.ai can read 1–2</text><text x="736" y="68" class="dimf" font-size="12">your IP, both device keys,</text><text x="736" y="84" class="dimf" font-size="12">frame size and timing</text><path d="M 716 112 H 722 V 370 H 716" class="lnseal thick" fill="none" /><text x="736" y="136" class="sealf" font-size="13" font-weight="700">only your two daemons</text><text x="736" y="154" class="sealf" font-size="13" font-weight="700">can open 3–5</text><text x="736" y="186" class="dimf" font-size="12">TLS 1.3 adds forward secrecy:</text><text x="736" y="203" class="dimf" font-size="12">a key stolen later can't</text><text x="736" y="220" class="dimf" font-size="12">decrypt old traffic.</text><text x="736" y="254" class="dimf" font-size="12">The TLS session is dropped</text><text x="736" y="271" class="dimf" font-size="12">when either side reconnects</text><text x="736" y="288" class="dimf" font-size="12">or is revoked.</text></svg>
