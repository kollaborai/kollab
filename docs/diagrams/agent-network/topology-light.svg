<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 384" width="1000" height="384" role="img" aria-label="Both the Mac&#x27;s and the VPS&#x27;s kollab daemons dial out to kollabor.ai on port 443; the relay forwards frames between them without opening them."><title>Both the Mac&#x27;s and the VPS&#x27;s kollab daemons dial out to kollabor.ai on port 443; the relay forwards frames between them without opening them.</title><style>svg{--bg:#F6F8FB;--panel:#EAEFF5;--line:#CDD4DD;--fg:#191E26;--dim:#5C6674;--you:#C65220;--seal:#1A703A;--agent:#304EA8;--warn:#94581A;--body:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;--mono:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;--display:var(--mono)} text { fill: var(--fg); font-family: var(--body); } .m { font-family: var(--mono); } .d { font-family: var(--display); letter-spacing: .08em; } .dimf { fill: var(--dim); } .youf { fill: var(--you); } .sealf { fill: var(--seal); } .agentf { fill: var(--agent); } .warnf { fill: var(--warn); } .numf { fill: var(--fg); } .fpanel { fill: var(--panel); } .fbg { fill: var(--bg); } .fseal { fill: var(--seal); } .ln { stroke: var(--fg); stroke-width: 1.3; } .sline { stroke: var(--line); stroke-width: 1.2; } .lnline { stroke: var(--line); stroke-width: 1.5; } .lndim { stroke: var(--dim); stroke-width: 1.3; } .lnyou { stroke: var(--you); stroke-width: 1.4; } .lnseal { stroke: var(--seal); stroke-width: 1.4; } .lnagent { stroke: var(--agent); stroke-width: 1.4; } .lnwarn { stroke: var(--warn); stroke-width: 1.4; } .med { stroke-width: 1.7; } .thick { stroke-width: 2.2; } .dash { stroke-dasharray: 7 6; } .mk { fill: var(--fg); } .mk-seal { fill: var(--seal); } .mk-agent { fill: var(--agent); } .mk-dim { fill: var(--dim); } .mk-warn { fill: var(--warn); }</style><rect width="1000" height="384" rx="14" fill="#F6F8FB"/><defs><marker id="f1-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="mk"/></marker><marker id="f1-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="mk-seal"/></marker><marker id="f1-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="mk-agent"/></marker><marker id="f1-d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="mk-dim"/></marker><marker id="f1-w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="mk-warn"/></marker></defs><path d="M 155 52 V 30 H 845 V 116" class="lndim" fill="none" stroke-dasharray="2 5" marker-end="url(#f1-d)"/><text x="500" y="22" class="m dimf" font-size="11.5" text-anchor="middle">your SSH session: only your keyboard. kollab never uses it.</text><rect x="20" y="52" width="270" height="320" rx="14" class="fpanel sline" /><text x="40" y="82" font-size="15" font-weight="700">Your Mac</text><text x="40" y="100" class="m dimf" font-size="11">kollab started in ~/work</text><rect x="365" y="52" width="270" height="320" rx="14" class="fpanel sline" /><text x="385" y="82" font-size="15" font-weight="700">kollabor.ai</text><text x="385" y="100" class="m dimf" font-size="11">the directory, public</text><rect x="710" y="52" width="270" height="320" rx="14" class="fpanel sline" /><text x="730" y="82" font-size="15" font-weight="700">New VPS</text><text x="730" y="100" class="m dimf" font-size="11">kollab started in its folder</text><rect x="40" y="116" width="230" height="46" rx="8" class="fbg ln" /><text x="56" y="136" font-size="13" font-weight="700">kollab window</text><text x="56" y="152" class="dimf" font-size="11">what you type into</text><line x1="155" y1="162" x2="155" y2="186" class="ln" /><text x="163" y="178" class="m dimf" font-size="10.5">unix socket</text><rect x="40" y="186" width="230" height="66" rx="8" class="fbg ln thick" /><text x="56" y="207" font-size="13" font-weight="700">daemon</text><text x="56" y="223" class="dimf" font-size="11.5">holds the network link</text><text x="56" y="240" class="m dimf" font-size="10.5">key: ~/.kollab/network/&lt;id&gt;/</text><rect x="40" y="266" width="93" height="22" rx="11" class="fbg lnagent" /><text x="86.5" y="281" class="m agentf" font-size="11" text-anchor="middle">koordinator</text><rect x="141" y="266" width="51" height="22" rx="11" class="fbg lnagent" /><text x="166.5" y="281" class="m agentf" font-size="11" text-anchor="middle">lapis</text><text x="40" y="306" class="dimf" font-size="11">agents run inside the daemon</text><text x="40" y="340" class="m dimf" font-size="11">start: kollab  ·  kollab -d</text><text x="40" y="357" class="m dimf" font-size="11">always on: kollab service install</text><rect x="730" y="116" width="230" height="46" rx="8" class="fbg ln" stroke-dasharray="5 4"/><text x="746" y="136" font-size="13" font-weight="700">kollab window (optional)</text><text x="746" y="152" class="dimf" font-size="11">over SSH, to set up or watch</text><line x1="845" y1="162" x2="845" y2="186" class="ln" /><text x="853" y="178" class="m dimf" font-size="10.5">unix socket</text><rect x="730" y="186" width="230" height="66" rx="8" class="fbg ln thick" /><text x="746" y="207" font-size="13" font-weight="700">daemon</text><text x="746" y="223" class="dimf" font-size="11.5">holds the network link</text><text x="746" y="240" class="m dimf" font-size="10.5">key: ~/.kollab/network/&lt;id&gt;/</text><rect x="730" y="266" width="93" height="22" rx="11" class="fbg lnagent" /><text x="776.5" y="281" class="m agentf" font-size="11" text-anchor="middle">koordinator</text><rect x="831" y="266" width="51" height="22" rx="11" class="fbg lnagent" /><text x="856.5" y="281" class="m agentf" font-size="11" text-anchor="middle">infra</text><text x="730" y="306" class="dimf" font-size="11">agents run inside the daemon</text><text x="730" y="340" class="m dimf" font-size="11">inbound ports needed: none</text><text x="730" y="357" class="m dimf" font-size="11">its firewall can stay closed</text><rect x="385" y="116" width="230" height="62" rx="8" class="fbg ln" /><text x="401" y="136" font-size="13" font-weight="700">signed key file</text><text x="401" y="152" class="m dimf" font-size="10.5">TXT _agent.kollabor.ai</text><text x="401" y="168" class="m dimf" font-size="10.5">→ /.well-known/agent-keys</text><rect x="385" y="196" width="230" height="46" rx="8" class="fbg ln thick" /><text x="500" y="215" font-size="13" text-anchor="middle" font-weight="700">TLS proxy :443</text><text x="500" y="232" class="dimf" font-size="11" text-anchor="middle">TLS ends here</text><line x1="500" y1="242" x2="500" y2="260" class="ln" marker-end="url(#f1-a)"/><rect x="385" y="262" width="230" height="58" rx="8" class="fbg ln" /><text x="500" y="281" font-size="13" text-anchor="middle" font-weight="700">relay</text><text x="500" y="297" class="dimf" font-size="11" text-anchor="middle">forwards frames by device key</text><text x="500" y="312" class="sealf" font-size="11" text-anchor="middle" font-weight="700">can't open them</text><rect x="385" y="330" width="112" height="34" rx="6" class="fbg sline" /><text x="441" y="344" font-size="11" text-anchor="middle" font-weight="700">mailbox</text><text x="441" y="358" class="dimf" font-size="10" text-anchor="middle">join codes, 5 min</text><rect x="503" y="330" width="112" height="34" rx="6" class="fbg sline" /><text x="559" y="344" font-size="11" text-anchor="middle" font-weight="700">presence</text><text x="559" y="358" class="dimf" font-size="10" text-anchor="middle">who's online</text><line x1="270" y1="219" x2="383" y2="219" class="ln thick" marker-end="url(#f1-a)"/><text x="327" y="210" class="m" font-size="11.5" text-anchor="middle">dials out</text><text x="327" y="236" class="m dimf" font-size="11.5" text-anchor="middle">wss :443</text><line x1="730" y1="219" x2="617" y2="219" class="ln thick" marker-end="url(#f1-a)"/><text x="672" y="210" class="m" font-size="11.5" text-anchor="middle">dials out</text><text x="672" y="236" class="m dimf" font-size="11.5" text-anchor="middle">wss :443</text></svg>
