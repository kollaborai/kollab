<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1230 1780" width="1230" height="1780" role="img" aria-label="The join in 27 steps between your Mac, kollabor.ai and the new VPS: the Mac makes a code, the VPS uses it to claim a mailbox offer, both prove keys through sealed envelopes, you accept on the Mac, the VPS receives its credential and profile, then both hold relay links and talk over TLS 1.3 inside Box frames."><title>The join in 27 steps between your Mac, kollabor.ai and the new VPS: the Mac makes a code, the VPS uses it to claim a mailbox offer, both prove keys through sealed envelopes, you accept on the Mac, the VPS receives its credential and profile, then both hold relay links and talk over TLS 1.3 inside Box frames.</title><style>svg{--bg:#F6F8FB;--panel:#EAEFF5;--line:#CDD4DD;--fg:#191E26;--dim:#5C6674;--you:#C65220;--seal:#1A703A;--agent:#304EA8;--warn:#94581A;--body:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;--mono:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;--display:var(--mono)} text { fill: var(--fg); font-family: var(--body); } .m { font-family: var(--mono); } .d { font-family: var(--display); letter-spacing: .08em; } .dimf { fill: var(--dim); } .youf { fill: var(--you); } .sealf { fill: var(--seal); } .agentf { fill: var(--agent); } .warnf { fill: var(--warn); } .numf { fill: var(--fg); } .fpanel { fill: var(--panel); } .fbg { fill: var(--bg); } .fseal { fill: var(--seal); } .ln { stroke: var(--fg); stroke-width: 1.3; } .sline { stroke: var(--line); stroke-width: 1.2; } .lnline { stroke: var(--line); stroke-width: 1.5; } .lndim { stroke: var(--dim); stroke-width: 1.3; } .lnyou { stroke: var(--you); stroke-width: 1.4; } .lnseal { stroke: var(--seal); stroke-width: 1.4; } .lnagent { stroke: var(--agent); stroke-width: 1.4; } .lnwarn { stroke: var(--warn); stroke-width: 1.4; } .med { stroke-width: 1.7; } .thick { stroke-width: 2.2; } .dash { stroke-dasharray: 7 6; } .mk { fill: var(--fg); } .mk-seal { fill: var(--seal); } .mk-agent { fill: var(--agent); } .mk-dim { fill: var(--dim); } .mk-warn { fill: var(--warn); }</style><rect width="1230" height="1780" rx="14" fill="#F6F8FB"/><defs><marker id="f2-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="mk"/></marker><marker id="f2-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="mk-seal"/></marker><marker id="f2-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="mk-agent"/></marker><marker id="f2-d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="mk-dim"/></marker><marker id="f2-w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="mk-warn"/></marker></defs><rect x="70" y="14" width="200" height="54" rx="10" class="fpanel ln" /><text x="170" y="37" font-size="14" text-anchor="middle" font-weight="700">Your Mac</text><text x="170" y="55" class="m dimf" font-size="11" text-anchor="middle">daemon in ~/work</text><rect x="370" y="14" width="200" height="54" rx="10" class="fpanel ln" /><text x="470" y="37" font-size="14" text-anchor="middle" font-weight="700">kollabor.ai</text><text x="470" y="55" class="m dimf" font-size="11" text-anchor="middle">relay + join-code mailbox</text><rect x="670" y="14" width="200" height="54" rx="10" class="fpanel ln" /><text x="770" y="37" font-size="14" text-anchor="middle" font-weight="700">New VPS</text><text x="770" y="55" class="m dimf" font-size="11" text-anchor="middle">daemon in its folder</text><text x="880" y="37" font-size="14" font-weight="700">What happens</text><text x="880" y="55" class="m dimf" font-size="11">dashed = an answer to a poll</text><rect x="0" y="102" width="1230" height="26" rx="0" class="fpanel" /><text x="16" y="119" class="d dimf" font-size="11">A  BEFORE YOU START · ON THE MAC</text><rect x="0" y="210" width="1230" height="26" rx="0" class="fpanel" /><text x="16" y="227" class="d dimf" font-size="11">B  MAKE A CODE · ON THE MAC</text><rect x="0" y="502" width="1230" height="26" rx="0" class="fpanel" /><text x="16" y="519" class="d dimf" font-size="11">C  TYPE THE CODE · ON THE VPS, OVER SSH</text><rect x="0" y="754" width="1230" height="26" rx="0" class="fpanel" /><text x="16" y="771" class="d dimf" font-size="11">D  PROVE IT · AUTOMATIC, BOTH SIDES</text><rect x="0" y="1046" width="1230" height="26" rx="0" class="fpanel" /><text x="16" y="1063" class="d dimf" font-size="11">E  YOU DECIDE · ON THE MAC</text><rect x="0" y="1200" width="1230" height="26" rx="0" class="fpanel" /><text x="16" y="1217" class="d dimf" font-size="11">F  HAND-OVER · AUTOMATIC</text><rect x="0" y="1538" width="1230" height="26" rx="0" class="fpanel" /><text x="16" y="1555" class="d dimf" font-size="11">G  CONNECTED · FROM NOW ON</text><line x1="170" y1="68" x2="170" y2="1774" class="lnline lifeline" /><line x1="470" y1="68" x2="470" y2="1774" class="lnline lifeline" /><line x1="770" y1="68" x2="770" y2="1774" class="lnline lifeline" /><line x1="170" y1="154" x2="462" y2="154" class="ln med" marker-end="url(#f2-a)"/><text x="320.0" y="147" class="m" font-size="12" text-anchor="middle">wss /relay/v1/ws</text><circle cx="890" cy="143" r="10" class="fbg ln"/><text x="890" y="147" class="m numf" font-size="11" text-anchor="middle" font-weight="700">1</text><text x="908" y="147" font-size="12.5">The Mac's daemon dials out on port 443 and</text><text x="908" y="163" font-size="12.5">stays on. It signs a nonce and joins its room.</text><rect x="111.55000000000001" y="249" width="116.89999999999999" height="24" rx="12" class="fbg lnyou med" /><text x="170" y="265" class="m youf" font-size="12" text-anchor="middle" font-weight="600">you: /connect</text><circle cx="890" cy="251" r="10" class="fbg lnyou"/><text x="890" y="255" class="m numf" font-size="11" text-anchor="middle" font-weight="700">2</text><text x="908" y="255" font-size="12.5">The Connect screen opens and the daemon</text><text x="908" y="271" font-size="12.5">starts a one-device offer.</text><path d="M 170 298 H 206 V 316 H 178" class="ln med" fill="none" marker-end="url(#f2-a)"/><text x="214" y="312" class="m" font-size="12" text-anchor="start">make code + keys</text><circle cx="890" cy="297" r="10" class="fbg ln"/><text x="890" y="301" class="m numf" font-size="11" text-anchor="middle" font-weight="700">3</text><text x="908" y="301" font-size="12.5">XXXX-XXXX: 40 bits, 5 minutes, one device.</text><text x="908" y="317" font-size="12.5">From it: lookup tag, verifier, sealing key.</text><line x1="170" y1="354" x2="462" y2="354" class="ln med" marker-end="url(#f2-a)"/><text x="320.0" y="347" class="m" font-size="12" text-anchor="middle">POST /enrollment/offers</text><circle cx="890" cy="343" r="10" class="fbg ln"/><text x="890" y="347" class="m numf" font-size="11" text-anchor="middle" font-weight="700">4</text><text x="908" y="347" font-size="12.5">Hashes of the tag and verifier, Mac key, room,</text><text x="908" y="363" font-size="12.5">expiry. Signed. The code itself never leaves.</text><rect x="71.4" y="387" width="197.2" height="24" rx="12" class="fbg lnyou med" /><text x="170" y="403" class="m youf" font-size="12" text-anchor="middle" font-weight="600">screen: 7QK4-M2XP · 4:59</text><circle cx="890" cy="389" r="10" class="fbg lnyou"/><text x="890" y="393" class="m numf" font-size="11" text-anchor="middle" font-weight="700">5</text><text x="908" y="393" font-size="12.5">Shown on a private screen only. Never in a</text><text x="908" y="409" font-size="12.5">command, a log or the chat.</text><line x1="170" y1="446" x2="462" y2="446" class="ln med" marker-end="url(#f2-a)" stroke-dasharray="6 5"/><text x="320.0" y="439" class="m" font-size="12" text-anchor="middle">POST …/poll · every 15 s</text><circle cx="890" cy="435" r="10" class="fbg ln"/><text x="890" y="439" class="m numf" font-size="11" text-anchor="middle" font-weight="700">6</text><text x="908" y="439" font-size="12.5">The Mac keeps asking the mailbox for a joiner.</text><rect x="693.3" y="541" width="153.4" height="24" rx="12" class="fbg lnyou med" /><text x="770" y="557" class="m youf" font-size="12" text-anchor="middle" font-weight="600">you: type the code</text><circle cx="890" cy="543" r="10" class="fbg lnyou"/><text x="890" y="547" class="m numf" font-size="11" text-anchor="middle" font-weight="700">7</text><text x="908" y="547" font-size="12.5">Install kollab, run it, pick Join with a code</text><text x="908" y="563" font-size="12.5">(or /connect). Masked form, never argv.</text><line x1="770" y1="600" x2="478" y2="600" class="ln med" marker-end="url(#f2-a)"/><text x="620.0" y="593" class="m" font-size="12" text-anchor="middle">TXT _agent.kollabor.ai</text><text x="620.0" y="616" class="m dimf" font-size="11.5" text-anchor="middle">GET /.well-known/agent-keys</text><circle cx="890" cy="589" r="10" class="fbg ln"/><text x="890" y="593" class="m numf" font-size="11" text-anchor="middle" font-weight="700">8</text><text x="908" y="593" font-size="12.5">Reads the directory's signed key file and pins</text><text x="908" y="609" font-size="12.5">its key. A changed key is refused later.</text><line x1="770" y1="652" x2="478" y2="652" class="ln med" marker-end="url(#f2-a)"/><text x="620.0" y="645" class="m" font-size="12" text-anchor="middle">POST /enrollment/lookup</text><circle cx="890" cy="641" r="10" class="fbg ln"/><text x="890" y="645" class="m numf" font-size="11" text-anchor="middle" font-weight="700">9</text><text x="908" y="645" font-size="12.5">VPS key + lookup tag → offer id. A wrong code</text><text x="908" y="661" font-size="12.5">finds nothing; 10 tries a minute per IP.</text><line x1="770" y1="698" x2="478" y2="698" class="ln med" marker-end="url(#f2-a)"/><text x="620.0" y="691" class="m" font-size="12" text-anchor="middle">POST …/request</text><circle cx="890" cy="687" r="10" class="fbg ln"/><text x="890" y="691" class="m numf" font-size="11" text-anchor="middle" font-weight="700">10</text><text x="908" y="691" font-size="12.5">VPS key, device name, verifier, and a request</text><text x="908" y="707" font-size="12.5">sealed with the code key. Now it waits.</text><line x1="470" y1="806" x2="178" y2="806" class="lnseal med" marker-end="url(#f2-s)" stroke-dasharray="6 5"/><text x="320.0" y="799" class="m" font-size="12" text-anchor="middle">poll → claimed</text><circle cx="890" cy="795" r="10" class="fbg lnseal"/><text x="890" y="799" class="m numf" font-size="11" text-anchor="middle" font-weight="700">11</text><text x="908" y="799" font-size="12.5">Verifier matched. The Mac gets the sealed</text><text x="908" y="815" font-size="12.5">request on its next poll.</text><line x1="170" y1="852" x2="462" y2="852" class="lnseal med" marker-end="url(#f2-s)"/><text x="320.0" y="845" class="m" font-size="12" text-anchor="middle">POST …/challenge</text><circle cx="890" cy="841" r="10" class="fbg lnseal"/><text x="890" y="845" class="m numf" font-size="11" text-anchor="middle" font-weight="700">12</text><text x="908" y="845" font-size="12.5">Sealed with the code key, signed by the Mac,</text><text x="908" y="861" font-size="12.5">pinned to the VPS key.</text><line x1="470" y1="898" x2="762" y2="898" class="lnseal med" marker-end="url(#f2-s)" stroke-dasharray="6 5"/><text x="620.0" y="891" class="m" font-size="12" text-anchor="middle">reply/poll → challenge</text><circle cx="890" cy="887" r="10" class="fbg lnseal"/><text x="890" y="891" class="m numf" font-size="11" text-anchor="middle" font-weight="700">13</text><text x="908" y="891" font-size="12.5">Only the code holder could seal this, so the</text><text x="908" y="907" font-size="12.5">VPS now trusts the Mac's key. Polls 5–20 s.</text><line x1="770" y1="944" x2="478" y2="944" class="lnseal med" marker-end="url(#f2-s)"/><text x="620.0" y="937" class="m" font-size="12" text-anchor="middle">POST …/proof</text><circle cx="890" cy="933" r="10" class="fbg lnseal"/><text x="890" y="937" class="m numf" font-size="11" text-anchor="middle" font-weight="700">14</text><text x="908" y="937" font-size="12.5">The VPS signs the challenge with its own</text><text x="908" y="953" font-size="12.5">device key.</text><line x1="470" y1="990" x2="178" y2="990" class="lnseal med" marker-end="url(#f2-s)" stroke-dasharray="6 5"/><text x="320.0" y="983" class="m" font-size="12" text-anchor="middle">poll → proof</text><circle cx="890" cy="979" r="10" class="fbg lnseal"/><text x="890" y="983" class="m numf" font-size="11" text-anchor="middle" font-weight="700">15</text><text x="908" y="983" font-size="12.5">The Mac checks that signature.</text><rect x="49.5" y="1085" width="241.0" height="24" rx="12" class="fbg lnyou med" /><text x="170" y="1101" class="m youf" font-size="12" text-anchor="middle" font-weight="600">screen: vps-home wants to join</text><circle cx="890" cy="1087" r="10" class="fbg lnyou"/><text x="890" y="1091" class="m numf" font-size="11" text-anchor="middle" font-weight="700">16</text><text x="908" y="1091" font-size="12.5">Device name + key fingerprint, and one line in</text><text x="908" y="1107" font-size="12.5">the main pane if the screen is closed.</text><rect x="115.2" y="1131" width="109.6" height="24" rx="12" class="fbg lnyou med" /><text x="170" y="1147" class="m youf" font-size="12" text-anchor="middle" font-weight="600">you: press a</text><circle cx="890" cy="1133" r="10" class="fbg lnyou"/><text x="890" y="1137" class="m numf" font-size="11" text-anchor="middle" font-weight="700">17</text><text x="908" y="1137" font-size="12.5">A person accepts. A guessed code still needs</text><text x="908" y="1153" font-size="12.5">this key press. /connect accept works too.</text><line x1="170" y1="1252" x2="462" y2="1252" class="lnseal med" marker-end="url(#f2-s)"/><text x="320.0" y="1245" class="m" font-size="12" text-anchor="middle">POST …/decision</text><circle cx="890" cy="1241" r="10" class="fbg lnseal"/><text x="890" y="1245" class="m numf" font-size="11" text-anchor="middle" font-weight="700">18</text><text x="908" y="1245" font-size="12.5">Sealed: membership credential, room invite,</text><text x="908" y="1261" font-size="12.5">network name, active LLM profile + API key.</text><line x1="470" y1="1298" x2="762" y2="1298" class="lnseal med" marker-end="url(#f2-s)" stroke-dasharray="6 5"/><text x="620.0" y="1291" class="m" font-size="12" text-anchor="middle">reply/poll → decision</text><circle cx="890" cy="1287" r="10" class="fbg lnseal"/><text x="890" y="1291" class="m numf" font-size="11" text-anchor="middle" font-weight="700">19</text><text x="908" y="1291" font-size="12.5">Ciphertext. kollabor.ai can't open it.</text><path d="M 770 1334 H 734 V 1352 H 762" class="lnseal med" fill="none" marker-end="url(#f2-s)"/><text x="726" y="1348" class="m" font-size="12" text-anchor="end">install + sign receipt</text><circle cx="890" cy="1333" r="10" class="fbg lnseal"/><text x="890" y="1337" class="m numf" font-size="11" text-anchor="middle" font-weight="700">20</text><text x="908" y="1337" font-size="12.5">Saves the profile privately, all or nothing,</text><text x="908" y="1353" font-size="12.5">then signs a receipt with its device key.</text><line x1="770" y1="1390" x2="478" y2="1390" class="lnseal med" marker-end="url(#f2-s)"/><text x="620.0" y="1383" class="m" font-size="12" text-anchor="middle">POST …/ack</text><circle cx="890" cy="1379" r="10" class="fbg lnseal"/><text x="890" y="1383" class="m numf" font-size="11" text-anchor="middle" font-weight="700">21</text><text x="908" y="1383" font-size="12.5">The signed receipt, sealed with the code key.</text><line x1="770" y1="1436" x2="478" y2="1436" class="ln med" marker-end="url(#f2-a)"/><text x="620.0" y="1429" class="m" font-size="12" text-anchor="middle">wss /relay/v1/ws</text><circle cx="890" cy="1425" r="10" class="fbg ln"/><text x="890" y="1429" class="m numf" font-size="11" text-anchor="middle" font-weight="700">22</text><text x="908" y="1429" font-size="12.5">The VPS dials out and holds its own link in</text><text x="908" y="1445" font-size="12.5">your room. Screen: joined macbook-kollab-net.</text><line x1="470" y1="1482" x2="178" y2="1482" class="lnseal med" marker-end="url(#f2-s)" stroke-dasharray="6 5"/><text x="320.0" y="1475" class="m" font-size="12" text-anchor="middle">ack/poll → receipt</text><circle cx="890" cy="1471" r="10" class="fbg lnseal"/><text x="890" y="1475" class="m numf" font-size="11" text-anchor="middle" font-weight="700">23</text><text x="908" y="1475" font-size="12.5">The Mac checks the receipt and approves the</text><text x="908" y="1491" font-size="12.5">VPS key. Screen: accepted vps-home.</text><circle cx="470" cy="1590" r="4" class="fbg ln"/><line x1="466" y1="1590" x2="178" y2="1590" class="ln med" marker-end="url(#f2-a)"/><text x="320.0" y="1583" class="m" font-size="12" text-anchor="middle">peers</text><line x1="474" y1="1590" x2="762" y2="1590" class="ln med" marker-end="url(#f2-a)"/><text x="620.0" y="1583" class="m" font-size="12" text-anchor="middle">peers</text><circle cx="890" cy="1579" r="10" class="fbg ln"/><text x="890" y="1583" class="m numf" font-size="11" text-anchor="middle" font-weight="700">24</text><text x="908" y="1583" font-size="12.5">Each side sees the other online. Roster:</text><text x="908" y="1599" font-size="12.5">koordinator@vps-home, infra@vps-home.</text><line x1="178" y1="1636" x2="762" y2="1636" class="lnseal thick" marker-end="url(#f2-s)" marker-start="url(#f2-s)"/><rect x="464" y="1630" width="12" height="12" rx="2" class="fbg ln" /><text x="320.0" y="1628" class="m" font-size="12" text-anchor="middle">TLS 1.3 handshake, inside Box frames</text><text x="620.0" y="1628" class="m dimf" font-size="11" text-anchor="middle">via relay, unread</text><circle cx="890" cy="1625" r="10" class="fbg lnseal"/><text x="890" y="1629" class="m numf" font-size="11" text-anchor="middle" font-weight="700">25</text><text x="908" y="1629" font-size="12.5">Mutual, pinned to both device keys. Set up</text><text x="908" y="1645" font-size="12.5">on first use; every message rides inside.</text><line x1="178" y1="1682" x2="762" y2="1682" class="lnseal thick" marker-end="url(#f2-s)"/><rect x="464" y="1676" width="12" height="12" rx="2" class="fbg ln" /><text x="320.0" y="1674" class="m" font-size="12" text-anchor="middle">sealed config sync</text><text x="620.0" y="1674" class="m dimf" font-size="11" text-anchor="middle">via relay, unread</text><circle cx="890" cy="1671" r="10" class="fbg lnseal"/><text x="890" y="1675" class="m numf" font-size="11" text-anchor="middle" font-weight="700">26</text><text x="908" y="1675" font-size="12.5">Settings, loadouts, MCP, API keys, agents/,</text><text x="908" y="1691" font-size="12.5">skills/. On change (checked every 10 s).</text><line x1="178" y1="1728" x2="762" y2="1728" class="lnagent thick" marker-end="url(#f2-g)"/><rect x="464" y="1722" width="12" height="12" rx="2" class="fbg ln" /><text x="320.0" y="1720" class="m" font-size="12" text-anchor="middle">lapis → infra@vps-home</text><text x="620.0" y="1720" class="m dimf" font-size="11" text-anchor="middle">via relay, unread</text><circle cx="890" cy="1717" r="10" class="fbg lnagent"/><text x="890" y="1721" class="m numf" font-size="11" text-anchor="middle" font-weight="700">27</text><text x="908" y="1721" font-size="12.5">A normal hub message. infra runs it with its</text><text x="908" y="1737" font-size="12.5">own tools and answers the same way.</text></svg>
