<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 292" width="1000" height="292" role="img" aria-label="kollabor.ai&#x27;s form: devices reach an edge server&#x27;s nginx on 443; a private WireGuard link carries traffic to a relay host running kollab relay run with several workers on a shared Valkey or Redis backend, plus a separate discovery publisher."><title>kollabor.ai&#x27;s form: devices reach an edge server&#x27;s nginx on 443; a private WireGuard link carries traffic to a relay host running kollab relay run with several workers on a shared Valkey or Redis backend, plus a separate discovery publisher.</title><style>svg{--bg:#121416;--panel:#191C20;--line:#2C323A;--fg:#ECF0F4;--dim:#9199A4;--you:#F86C2B;--seal:#60BE78;--agent:#91AAFF;--warn:#E0983E;--body:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;--mono:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;--display:var(--mono)} text { fill: var(--fg); font-family: var(--body); } .m { font-family: var(--mono); } .d { font-family: var(--display); letter-spacing: .08em; } .dimf { fill: var(--dim); } .youf { fill: var(--you); } .sealf { fill: var(--seal); } .agentf { fill: var(--agent); } .warnf { fill: var(--warn); } .numf { fill: var(--fg); } .fpanel { fill: var(--panel); } .fbg { fill: var(--bg); } .fseal { fill: var(--seal); } .ln { stroke: var(--fg); stroke-width: 1.3; } .sline { stroke: var(--line); stroke-width: 1.2; } .lnline { stroke: var(--line); stroke-width: 1.5; } .lndim { stroke: var(--dim); stroke-width: 1.3; } .lnyou { stroke: var(--you); stroke-width: 1.4; } .lnseal { stroke: var(--seal); stroke-width: 1.4; } .lnagent { stroke: var(--agent); stroke-width: 1.4; } .lnwarn { stroke: var(--warn); stroke-width: 1.4; } .med { stroke-width: 1.7; } .thick { stroke-width: 2.2; } .dash { stroke-dasharray: 7 6; } .mk { fill: var(--fg); } .mk-seal { fill: var(--seal); } .mk-agent { fill: var(--agent); } .mk-dim { fill: var(--dim); } .mk-warn { fill: var(--warn); }</style><rect width="1000" height="292" rx="14" fill="#121416"/><defs><marker id="f6-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="mk"/></marker><marker id="f6-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="mk-seal"/></marker><marker id="f6-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="mk-agent"/></marker><marker id="f6-d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="mk-dim"/></marker><marker id="f6-w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="mk-warn"/></marker></defs><rect x="20" y="112" width="130" height="72" rx="10" class="fbg ln" /><text x="85" y="136" font-size="13" text-anchor="middle" font-weight="700">devices</text><text x="85" y="154" class="m dimf" font-size="11" text-anchor="middle">/connect</text><text x="85" y="170" class="m dimf" font-size="11" text-anchor="middle">kollabor.ai</text><rect x="212" y="40" width="236" height="236" rx="14" class="fpanel sline" /><text x="230" y="66" font-size="14" font-weight="700">edge server</text><text x="230" y="84" class="dimf" font-size="11">public, ports 80 and 443</text><rect x="230" y="100" width="200" height="156" rx="10" class="fbg ln thick" /><text x="246" y="122" font-size="12.5" font-weight="700">nginx · TLS :443</text><text x="246" y="146" class="m" font-size="10.5">key file · health</text><text x="246" y="164" class="m" font-size="10.5">ws · enrollment/*</text><text x="246" y="212" class="m warnf" font-size="10.5" font-weight="700">never: metrics</text><text x="246" y="236" class="dimf" font-size="11">same four routes</text><line x1="150" y1="148" x2="228" y2="148" class="ln thick" marker-end="url(#f6-a)"/><text x="189" y="140" class="m dimf" font-size="10" text-anchor="middle">wss, HTTPS</text><line x1="430" y1="178" x2="528" y2="178" class="ln thick" marker-end="url(#f6-a)"/><text x="479" y="170" class="dimf" font-size="11" text-anchor="middle">private link</text><text x="479" y="196" class="m dimf" font-size="10.5" text-anchor="middle">WireGuard</text><rect x="530" y="40" width="450" height="236" rx="14" class="fpanel sline" /><text x="548" y="66" font-size="14" font-weight="700">relay host</text><text x="548" y="84" class="dimf" font-size="11">systemd services</text><rect x="548" y="100" width="236" height="156" rx="10" class="fbg ln thick" /><text x="562" y="122" class="m" font-size="12" font-weight="700">kollab relay run</text><text x="562" y="138" class="m dimf" font-size="10.5">--config runtime.json</text><rect x="562" y="150" width="100" height="30" rx="6" class="fpanel sline" /><text x="612" y="170" class="m" font-size="11" text-anchor="middle">worker 1</text><rect x="670" y="150" width="100" height="30" rx="6" class="fpanel sline" /><text x="720" y="170" class="m" font-size="11" text-anchor="middle">worker 2…</text><line x1="612" y1="180" x2="612" y2="204" class="ln" /><line x1="720" y1="180" x2="720" y2="204" class="ln" /><rect x="562" y="204" width="208" height="38" rx="6" class="fpanel sline" /><text x="666" y="222" font-size="11.5" text-anchor="middle" font-weight="700">shared backend</text><text x="666" y="236" class="dimf" font-size="10" text-anchor="middle">Valkey / Redis: leases, inboxes</text><rect x="800" y="100" width="164" height="72" rx="10" class="fbg ln" /><text x="814" y="122" font-size="11.5" font-weight="700">discovery publisher</text><text x="814" y="140" class="m dimf" font-size="10">--watch · every 60 s</text><text x="814" y="158" class="dimf" font-size="10.5">signs the key file</text><rect x="800" y="184" width="164" height="72" rx="10" class="fbg ln" /><text x="814" y="206" class="m" font-size="11" font-weight="700">health :9080</text><text x="814" y="224" class="dimf" font-size="10.5">private; publisher only</text><text x="814" y="240" class="dimf" font-size="10.5">advertises a ready relay</text></svg>
