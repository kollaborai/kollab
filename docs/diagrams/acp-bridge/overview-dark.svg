<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 474" width="1000" height="474" role="img" aria-label="Kollab speaks ACP both ways: an ACP client such as Zed drives a kollab agent through kollab acp, and kollab runs Claude Code, Codex and Gemini CLI as hub members over ACP; the network makes every one of them reachable from your other devices."><title>Kollab speaks ACP both ways: an ACP client such as Zed drives a kollab agent through kollab acp, and kollab runs Claude Code, Codex and Gemini CLI as hub members over ACP; the network makes every one of them reachable from your other devices.</title><style>svg{--bg:#121416;--panel:#191C20;--line:#2C323A;--fg:#ECF0F4;--dim:#9199A4;--you:#F86C2B;--seal:#60BE78;--agent:#91AAFF;--warn:#E0983E;--body:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;--mono:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;--display:var(--mono)} text { fill: var(--fg); font-family: var(--body); } .m { font-family: var(--mono); } .d { font-family: var(--display); letter-spacing: .08em; } .dimf { fill: var(--dim); } .youf { fill: var(--you); } .sealf { fill: var(--seal); } .agentf { fill: var(--agent); } .warnf { fill: var(--warn); } .numf { fill: var(--fg); } .fpanel { fill: var(--panel); } .fbg { fill: var(--bg); } .fseal { fill: var(--seal); } .ln { stroke: var(--fg); stroke-width: 1.3; } .sline { stroke: var(--line); stroke-width: 1.2; } .lnline { stroke: var(--line); stroke-width: 1.5; } .lndim { stroke: var(--dim); stroke-width: 1.3; } .lnyou { stroke: var(--you); stroke-width: 1.4; } .lnseal { stroke: var(--seal); stroke-width: 1.4; } .lnagent { stroke: var(--agent); stroke-width: 1.4; } .lnwarn { stroke: var(--warn); stroke-width: 1.4; } .med { stroke-width: 1.7; } .thick { stroke-width: 2.2; } .dash { stroke-dasharray: 7 6; } .mk { fill: var(--fg); } .mk-seal { fill: var(--seal); } .mk-agent { fill: var(--agent); } .mk-dim { fill: var(--dim); } .mk-warn { fill: var(--warn); } .mk-you { fill: var(--you); }</style><rect width="1000" height="474" rx="14" fill="#121416"/><defs><marker id="a1-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="mk"/></marker><marker id="a1-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="mk-seal"/></marker><marker id="a1-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="mk-agent"/></marker><marker id="a1-d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="mk-dim"/></marker><marker id="a1-w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="mk-warn"/></marker><marker id="a1-y" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="mk-you"/></marker></defs><line x1="20" y1="22" x2="54" y2="22" class="lnagent thick" marker-end="url(#a1-g)"/><text x="64" y="26" class="m dimf" font-size="11">ACP · JSON-RPC over stdio</text><line x1="265.5" y1="22" x2="299.5" y2="22" class="ln med" marker-end="url(#a1-a)"/><text x="309.5" y="26" class="m dimf" font-size="11">kollab hub socket</text><line x1="457.4" y1="22" x2="491.4" y2="22" class="lnseal thick" marker-end="url(#a1-s)"/><text x="501.4" y="26" class="m dimf" font-size="11">kollab network · sealed</text><rect x="20" y="52" width="200" height="330" rx="14" class="fpanel sline" /><text x="36" y="80" font-size="15" font-weight="700">ACP clients</text><text x="36" y="98" class="m dimf" font-size="11">editors, other harnesses</text><rect x="260" y="52" width="470" height="330" rx="14" class="fpanel sline" /><text x="276" y="80" font-size="15" font-weight="700">kollab, on your laptop</text><text x="276" y="98" class="m dimf" font-size="11">every agent in the hub is a member</text><rect x="770" y="52" width="210" height="330" rx="14" class="fpanel sline" /><text x="786" y="80" font-size="15" font-weight="700">harness processes</text><text x="786" y="98" class="m dimf" font-size="11">one per agent, own login</text><rect x="36" y="118" width="168" height="44" rx="8" class="fbg ln" /><text x="52" y="137.0" font-size="13" font-weight="700">Zed</text><text x="52" y="154.0" class="dimf" font-size="11.5">editor</text><line x1="204" y1="140" x2="238" y2="140" class="lnagent med" /><rect x="36" y="172" width="168" height="44" rx="8" class="fbg ln" /><text x="52" y="191.0" font-size="13" font-weight="700">JetBrains</text><text x="52" y="208.0" class="dimf" font-size="11.5">IDEs</text><line x1="204" y1="194" x2="238" y2="194" class="lnagent med" /><rect x="36" y="226" width="168" height="44" rx="8" class="fbg ln" /><text x="52" y="245.0" font-size="13" font-weight="700">Buzz</text><text x="52" y="262.0" class="dimf" font-size="11.5">agent harness</text><line x1="204" y1="248" x2="238" y2="248" class="lnagent med" /><line x1="238" y1="140" x2="238" y2="248" class="lnagent med" /><text x="36" y="300" class="dimf" font-size="11.5">or any ACP client</text><text x="36" y="324" class="dimf" font-size="11">qualified: Zed first;</text><text x="36" y="340" class="dimf" font-size="11">JetBrains, Buzz, T3 Code</text><text x="36" y="356" class="dimf" font-size="11">once their runs pass</text><line x1="238" y1="140" x2="273" y2="140" class="lnagent thick" marker-end="url(#a1-g)"/><text x="240" y="128" class="m agentf" font-size="11" text-anchor="middle" font-weight="700">ACP</text><rect x="275" y="118" width="200" height="44" rx="8" class="fbg ln" /><text x="291" y=