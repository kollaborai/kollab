<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" role="img" aria-label="What kollab controls and what the harness keeps. Kollab owns the agent: its name, hub messages, network trust, windows, permission prompts and transcript. The harness owns the brain: model, login, context, tools, its own permission rules, hooks and cost. ACP carries session/new, session/prompt, session/update, session/request_permission, session/cancel and the stop reason between them, and the harness calls back through kollab mcp hub."><title>What kollab controls and what the harness keeps. Kollab owns the agent: its name, hub messages, network trust, windows, permission prompts and transcript. The harness owns the brain: model, login, context, tools, its own permission rules, hooks and cost. ACP carries session/new, session/prompt, session/update, session/request_permission, session/cancel and the stop reason between them, and the harness calls back through kollab mcp hub.</title><style>svg{--bg:#F6F8FB;--panel:#EAEFF5;--line:#CDD4DD;--fg:#191E26;--dim:#5C6674;--you:#C65220;--seal:#1A703A;--agent:#304EA8;--warn:#94581A;--body:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;--mono:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;--display:var(--mono)} text { fill: var(--fg); font-family: var(--body); } .m { font-family: var(--mono); } .d { font-family: var(--display); letter-spacing: .08em; } .dimf { fill: var(--dim); } .youf { fill: var(--you); } .sealf { fill: var(--seal); } .agentf { fill: var(--agent); } .warnf { fill: var(--warn); } .numf { fill: var(--fg); } .fpanel { fill: var(--panel); } .fbg { fill: var(--bg); } .fseal { fill: var(--seal); } .ln { stroke: var(--fg); stroke-width: 1.3; } .sline { stroke: var(--line); stroke-width: 1.2; } .lnline { stroke: var(--line); stroke-width: 1.5; } .lndim { stroke: var(--dim); stroke-width: 1.3; } .lnyou { stroke: var(--you); stroke-width: 1.4; } .lnseal { stroke: var(--seal); stroke-width: 1.4; } .lnagent { stroke: var(--agent); stroke-width: 1.4; } .lnwarn { stroke: var(--warn); stroke-width: 1.4; } .med { stroke-width: 1.7; } .thick { stroke-width: 2.2; } .dash { stroke-dasharray: 7 6; } .mk { fill: var(--fg); } .mk-seal { fill: var(--seal); } .mk-agent { fill: var(--agent); } .mk-dim { fill: var(--dim); } .mk-warn { fill: var(--warn); } .mk-you { fill: var(--you); }</style><rect width="1000" height="500" rx="14" fill="#F6F8FB"/><defs><marker id="a2-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="mk"/></marker><marker id="a2-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="mk-seal"/></marker><marker id="a2-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="mk-agent"/></marker><marker id="a2-d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="mk-dim"/></marker><marker id="a2-w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="mk-warn"/></marker><marker id="a2-y" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="mk-you"/></marker></defs><line x1="20" y1="22" x2="54" y2="22" class="lnagent thick" marker-end="url(#a2-g)"/><text x="64" y="26" class="m dimf" font-size="11">ACP · stdio</text><line x1="171.7" y1="22" x2="205.7" y2="22" class="lndim med" marker-end="url(#a2-d)" stroke-dasharray="6 5"/><text x="215.7" y="26" class="m dimf" font-size="11">MCP · kollab's hub tools</text><line x1="410.5" y1="22" x2="444.5" y2="22" class="ln med" marker-end="url(#a2-a)"/><text x="454.5" y="26" class="m dimf" font-size="11">kollab hub socket</text><rect x="20" y="52" width="320" height="372" rx="14" class="fpanel sline" /><text x="36" y="80" font-size="15" font-weight="700">kollab owns the agent</text><text x="36" y="98" class="m dimf" font-size="11">every kollab agent has these, claude too</text><circle cx="44" cy="124" r="3.5" class="fbg ln"/><text x="56" y="128" font-size="13" font-weight="700">Name and roster</text><text x="56" y="145" class="dimf" font-size="11.5">claude here, claude@laptop everywhere</text><circle cx="44" cy="168" r="3.5" class="fbg ln"/><text x="56" y="172" font-size="13" font-weight="700">Hub messages</text><text x="56" y="189" class="dimf" font-size="11.5">prompts in; answers and hub tools out</text><circle cx="44" cy="212" r="3.5" class="fbg ln"/><text x="56" y="216" font-size="13" font-weight="700">Network and trust</text><text x="56" y="233" class="dimf" font-size="11.5">open, agents, manual: as for any agent</text><circle cx="44" cy="256" r="3.5" class="fbg ln"/><text x="56" y="260" font-size="13" font-weight="700">Windows</text><text x="56" y="277" class="dimf" font-size="11.5">terminal, web UI and phone attach to it</text><circle cx="44" cy="300" r="3.5" class="fbg ln"/><text x="56" y="304" font-size="13" font-weight="700">Permission prompts</text><text x="56" y="321" class="dimf" font-size="11.5">your approval mode, in every window</text><circle cx="44" cy="344" r="3.5" class="fbg ln"/><text x="56" y="348" font-size="13" font-weight="700">The transcript</text><text x="56" y="365" class="dimf" font-size="11.5">what you see; /resume reloads it</text><text x="36" y="404" class="sealf" font-size="12" font-weight="700">kollab decides these</text><rect x="660" y="52" width="320" height="372" rx="14" class="fpanel sline" /><text x="676" y="80" font-size="15" font-weight="700">the harness owns the brain</text><text x="676" y="98" class="m dimf" font-size="11">Claude Code, Codex, Gemini CLI, …</text><circle cx="684" cy="124" r="3.5" class="fbg ln"/><text x="696" y="128" font-size="13" font-weight="700">Model and login</text><text x="696" y="145" class="dimf" font-size="11.5">Pro/Max, ChatGPT or an API key</text><circle cx="684" cy="168" r="3.5" class="fbg ln"/><text x="696" y="172" font-size="13" font-weight="700">Context and memory</text><text x="696" y="189" class="dimf" font-size="11.5">its history, compaction, CLAUDE.md</text><circle cx="684" cy="212" r="3.5" class="fbg ln"/><text x="696" y="216" font-size="13" font-weight="700">Tools</text><text x="696" y="233" class="dimf" font-size="11.5">files, shell, web, its own MCP servers</text><circle cx="684" cy="256" r="3.5" class="fbg ln"/><text x="696" y="260" font-size="13" font-weight="700">What needs a prompt</text><text x="696" y="277" class="dimf" font-size="11.5">its allow rules run without asking</text><circle cx="684" cy="300" r="3.5" class="fbg ln"/><text x="696" y="304" font-size="13" font-weight="700">Hooks</text><text x="696" y="321" class="dimf" font-size="11.5">its hooks run; kollab's config hooks don't</text><circle cx="684" cy="344" r="3.5" class="fbg ln"/><text x="696" y="348" font-size="13" font-weight="700">Cost</text><text x="696" y="365" class="dimf" font-size="11.5">billed to its login, not to kollab</text><text x="676" y="404" class="warnf" font-size="12" font-weight="700">kollab sees these only through ACP</text><text x="500" y="80" font-size="15" text-anchor="middle" font-weight="700">the ACP wire</text><text x="500" y="98" class="m dimf" font-size="11" text-anchor="middle">one session per agent</text><line x1="346" y1="136" x2="654" y2="136" class="lnagent med" marker-end="url(#a2-g)"/><text x="500" y="128" class="m" font-size="12" text-anchor="middle">session/new</text><text x="500" y="151" class="dimf" font-size="11" text-anchor="middle">cwd + kollab's hub tools</text><line x1="346" y1="180" x2="654" y2="180" class="lnagent med" marker-end="url(#a2-g)"/><text x="500" y="172" class="m" font-size="12" text-anchor="middle">session/prompt</text><text x="500" y="195" class="dimf" font-size="11" text-anchor="middle">your input and messages to claude</text><line x1="654" y1="224" x2="346" y2="224" class="lnagent med" marker-end="url(#a2-g)"/><text x="500" y="216" class="m" font-size="12" text-anchor="middle">session/update</text><text x="500" y="239" class="dimf" font-size="11" text-anchor="middle">text, thinking, tool cards, plan</text><line x1="346" y1="268" x2="654" y2="268" class="lnagent med" marker-end="url(#a2-g)" marker-start="url(#a2-g)"/><text x="500" y="260" class="m" font-size="12" text-anchor="middle">session/request_permission</text><text x="500" y="283" class="dimf" font-size="11" text-anchor="middle">you or your approval mode answer</text><line x1="346" y1="312" x2="654" y2="312" class="lnagent med" marker-end="url(#a2-g)"/><text x="500" y="304" class="m" font-size="12" text-anchor="middle">session/cancel</text><text x="500" y="327" class="dimf" font-size="11" text-anchor="middle">Esc or Stop</text><line x1="654" y1="356" x2="346" y2="356" class="lnagent med" marker-end="url(#a2-g)"/><text x="500" y="348" class="m" font-size="12" text-anchor="middle">stop reason</text><text x="500" y="371" class="dimf" font-size="11" text-anchor="middle">end_turn, cancelled, refusal, …</text><rect x="350" y="440" width="300" height="46" rx="8" class="fbg lnline" /><text x="500" y="459" class="m" font-size="12.5" text-anchor="middle" font-weight="700">kollab mcp hub</text><text x="500" y="476" class="m dimf" font-size="10.5" text-anchor="middle">hub_msg · hub_ask · hub_status · hub_agents</text><path d="M 820 426 V 463 H 654" class="lndim med" fill="none" marker-end="url(#a2-d)" stroke-dasharray="6 5"/><text x="737" y="456" class="m dimf" font-size="11" text-anchor="middle">MCP · stdio</text><path d="M 348 463 H 180 V 428" class="ln med" fill="none" marker-end="url(#a2-a)"/><text x="264" y="456" class="m dimf" font-size="11" text-anchor="middle">hub socket</text></svg>
