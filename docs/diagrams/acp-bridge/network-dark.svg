<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 432" width="1000" height="432" role="img" aria-label="Across machines: lapis on the laptop sends a hub message to claude@home-server; the network carries it sealed; on home-server, trust decides first, then kollab hands the message to Claude Code over ACP on stdio. ACP never leaves home-server."><title>Across machines: lapis on the laptop sends a hub message to claude@home-server; the network carries it sealed; on home-server, trust decides first, then kollab hands the message to Claude Code over ACP on stdio. ACP never leaves home-server.</title><style>svg{--bg:#121416;--panel:#191C20;--line:#2C323A;--fg:#ECF0F4;--dim:#9199A4;--you:#F86C2B;--seal:#60BE78;--agent:#91AAFF;--warn:#E0983E;--body:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;--mono:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;--display:var(--mono)} text { fill: var(--fg); font-family: var(--body); } .m { font-family: var(--mono); } .d { font-family: var(--display); letter-spacing: .08em; } .dimf { fill: var(--dim); } .youf { fill: var(--you); } .sealf { fill: var(--seal); } .agentf { fill: var(--agent); } .warnf { fill: var(--warn); } .numf { fill: var(--fg); } .fpanel { fill: var(--panel); } .fbg { fill: var(--bg); } .fseal { fill: var(--seal); } .ln { stroke: var(--fg); stroke-width: 1.3; } .sline { stroke: var(--line); stroke-width: 1.2; } .lnline { stroke: var(--line); stroke-width: 1.5; } .lndim { stroke: var(--dim); stroke-width: 1.3; } .lnyou { stroke: var(--you); stroke-width: 1.4; } .lnseal { stroke: var(--seal); stroke-width: 1.4; } .lnagent { stroke: var(--agent); stroke-width: 1.4; } .lnwarn { stroke: var(--warn); stroke-width: 1.4; } .med { stroke-width: 1.7; } .thick { stroke-width: 2.2; } .dash { stroke-dasharray: 7 6; } .mk { fill: var(--fg); } .mk-seal { fill: var(--seal); } .mk-agent { fill: var(--agent); } .mk-dim { fill: var(--dim); } .mk-warn { fill: var(--warn); } .mk-you { fill: var(--you); }</style><rect width="1000" height="432" rx="14" fill="#121416"/><defs><marker id="a4-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="mk"/></marker><marker id="a4-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="mk-seal"/></marker><marker id="a4-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="mk-agent"/></marker><marker id="a4-d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="mk-dim"/></marker><marker id="a4-w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="mk-warn"/></marker><marker id="a4-y" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="mk-you"/></marker></defs><line x1="20" y1="22" x2="54" y2="22" class="lnseal thick" marker-end="url(#a4-s)"/><text x="64" y="26" class="m dimf" font-size="11">kollab network · sealed</text><line x1="252.1" y1="22" x2="286.1" y2="22" class="ln med" marker-end="url(#a4-a)"/><text x="296.1" y="26" class="m dimf" font-size="11">kollab, inside home-server</text><line x1="504.3" y1="22" x2="538.3" y2="22" class="lnagent thick" marker-end="url(#a4-g)"/><text x="548.3" y="26" class="m dimf" font-size="11">ACP · stdio, inside one machine</text><rect x="20" y="52" width="280" height="360" rx="14" class="fpanel sline" /><text x="36" y="80" font-size="15" font-weight="700">laptop</text><text x="36" y="98" class="m dimf" font-size="11">where you work</text><rect x="340" y="52" width="250" height="360" rx="14" class="fpanel sline" /><text x="356" y="80" font-size="15" font-weight="700">the network</text><text x="356" y="98" class="m dimf" font-size="11">relay or direct · sealed</text><rect x="630" y="52" width="350" height="360" rx="14" class="fpanel sline" /><text x="646" y="80" font-size="15" font-weight="700">home-server</text><text x="646" y="98" class="m dimf" font-size="11">kollab + Claude Code installed</text><rect x="36" y="124" width="248" height="50" rx="8" class="fbg ln" /><text x="52" y="146.0" font-size="13" font-weight="700">lapis</text><text x="52" y="163.0" class="m dimf" font-size="11">hub_msg to="claude@home-server"</text><text x="36" y="300" class="dimf" font-size="11.5">claude@home-server is a name in</text><text x="36" y="318" class="dimf" font-size="11.5">the roster, like any agent@device;</text><text x="36" y="336" class="dimf" font-size="11.5">the web UI here opens it when</text><text x="36" y="354" class="dimf" font-size="11.5">home-server's trust allows</text><rect x="356" y="124" width="218" height="50" rx="8" class="fbg ln" /><text x="372" y="146.0" font-size="13" font-weight="700">relay</text><text x="372" y="163.0" class="dimf" font-size="11.5">forwards frames it can't read</text><text x="356" y="300" class="dimf" font-size="11.5">kollab's own protocol carries it:</text><text x="356" y="318" class="dimf" font-size="11.5">ACP's remote transport is a draft,</text><text x="356" y="336" class="dimf" font-size="11.5">so ACP never crosses the wire</text><rect x="646" y="124" width="318" height="50" rx="8" class="fbg lnseal" /><text x="662" y="146.0" font-size="13" font-weight="700">trust: open · agents · manual</text><text x="662" y="163.0" class="dimf" font-size="11.5">may lapis@laptop reach claude?</text><line x1="805" y1="176" x2="805" y2="204" class="ln med" marker-end="url(#a4-a)"/><text x="815" y="194" class="m dimf" font-size="11">allowed</text><rect x="646" y="206" width="318" height="50" rx="8" class="fbg lnagent" /><text x="662" y="228.0" font-size="13" font-weight="700">claude</text><text x="662" y="245.0" class="dimf" font-size="11.5">kollab agent · brain: Claude Code</text><line x1="805" y1="258" x2="805" y2="290" class="lnagent thick" marker-end="url(#a4-g)" marker-start="url(#a4-g)"/><text x="815" y="278" class="m agentf" font-size="11">ACP · stdio</text><rect x="646" y="292" width="318" height="50" rx="8" class="fbg ln" /><text x="662" y="314.0" class="m" font-size="12.5" font-weight="700">claude-agent-acp</text><text x="662" y="331.0" class="dimf" font-size="11.5">Claude Code, logged in here</text><text x="646" y="370" class="agentf" font-size="11.5" font-weight="700">ACP never leaves this machine;</text><text x="646" y="388" class="dimf" font-size="11.5">prompts go to the windows its trust lets open claude</text><line x1="286" y1="149" x2="354" y2="149" class="lnseal thick" marker-end="url(#a4-s)" marker-start="url(#a4-s)"/><text x="320" y="141" class="m" font-size="11" text-anchor="middle">hub_msg</text><text x="320" y="166" class="m dimf" font-size="11" text-anchor="middle">sealed</text><line x1="576" y1="149" x2="644" y2="149" class="lnseal thick" marker-end="url(#a4-s)" marker-start="url(#a4-s)"/><text x="610" y="141" class="m" font-size="11" text-anchor="middle">delivered</text><text x="610" y="166" class="m dimf" font-size="11" text-anchor="middle">both ways</text></svg>
