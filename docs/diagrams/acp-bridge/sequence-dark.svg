<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 786" width="1000" height="786" role="img" aria-label="One request in 11 steps: you ask lapis to have claude review your diff; lapis sends a hub message; kollab turns it into an ACP prompt for Claude Code; Claude Code streams tool cards and asks permission to run the tests; you approve in kollab&#x27;s prompt; Claude Code ends its turn, kollab sends its final text to lapis on lapis&#x27;s thread, and lapis tells you what claude found."><title>One request in 11 steps: you ask lapis to have claude review your diff; lapis sends a hub message; kollab turns it into an ACP prompt for Claude Code; Claude Code streams tool cards and asks permission to run the tests; you approve in kollab&#x27;s prompt; Claude Code ends its turn, kollab sends its final text to lapis on lapis&#x27;s thread, and lapis tells you what claude found.</title><style>svg{--bg:#121416;--panel:#191C20;--line:#2C323A;--fg:#ECF0F4;--dim:#9199A4;--you:#F86C2B;--seal:#60BE78;--agent:#91AAFF;--warn:#E0983E;--body:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;--mono:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;--display:var(--mono)} text { fill: var(--fg); font-family: var(--body); } .m { font-family: var(--mono); } .d { font-family: var(--display); letter-spacing: .08em; } .dimf { fill: var(--dim); } .youf { fill: var(--you); } .sealf { fill: var(--seal); } .agentf { fill: var(--agent); } .warnf { fill: var(--warn); } .numf { fill: var(--fg); } .fpanel { fill: var(--panel); } .fbg { fill: var(--bg); } .fseal { fill: var(--seal); } .ln { stroke: var(--fg); stroke-width: 1.3; } .sline { stroke: var(--line); stroke-width: 1.2; } .lnline { stroke: var(--line); stroke-width: 1.5; } .lndim { stroke: var(--dim); stroke-width: 1.3; } .lnyou { stroke: var(--you); stroke-width: 1.4; } .lnseal { stroke: var(--seal); stroke-width: 1.4; } .lnagent { stroke: var(--agent); stroke-width: 1.4; } .lnwarn { stroke: var(--warn); stroke-width: 1.4; } .med { stroke-width: 1.7; } .thick { stroke-width: 2.2; } .dash { stroke-dasharray: 7 6; } .mk { fill: var(--fg); } .mk-seal { fill: var(--seal); } .mk-agent { fill: var(--agent); } .mk-dim { fill: var(--dim); } .mk-warn { fill: var(--warn); } .mk-you { fill: var(--you); }</style><rect width="1000" height="786" rx="14" fill="#121416"/><defs><marker id="a3-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="mk"/></marker><marker id="a3-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="mk-seal"/></marker><marker id="a3-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="mk-agent"/></marker><marker id="a3-d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="mk-dim"/></marker><marker id="a3-w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="mk-warn"/></marker><marker id="a3-y" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="mk-you"/></marker></defs><rect x="10" y="14" width="180" height="54" rx="10" class="fpanel ln" /><text x="100" y="37" font-size="14" text-anchor="middle" font-weight="700">You</text><text x="100" y="55" class="m dimf" font-size="11" text-anchor="middle">terminal, web UI, phone</text><rect x="250" y="14" width="180" height="54" rx="10" class="fpanel ln" /><text x="340" y="37" font-size="14" text-anchor="middle" font-weight="700">lapis</text><text x="340" y="55" class="m dimf" font-size="11" text-anchor="middle">kollab agent · model API</text><rect x="520" y="14" width="180" height="54" rx="10" class="fpanel ln" /><text x="610" y="37" font-size="14" text-anchor="middle" font-weight="700">claude</text><text x="610" y="55" class="m dimf" font-size="11" text-anchor="middle">kollab agent · ACP client</text><rect x="790" y="14" width="180" height="54" rx="10" class="fpanel ln" /><text x="880" y="37" font-size="14" text-anchor="middle" font-weight="700">Claude Code</text><text x="880" y="55" class="m dimf" font-size="11" text-anchor="middle">claude-agent-acp</text><rect x="0" y="102" width="1000" height="26" rx="0" class="fpanel" /><rect x="0" y="296" width="1000" height="26" rx="0" class="fpanel" /><rect x="0" y="578" width="1000" height="26" rx="0" class="fpanel" /><line x1="100" y1="68" x2="100" y2="748" class="lnline" /><line x1="340" y1="68" x2="340" y2="748" class="lnline" /><line x1="610" y1="68" x2="610" y2="748" class="lnline" /><line x1="880" y1="68" x2="880" y2="748" class="lnline" /><rect x="0" y="102" width="196.0" height="26" rx="0" class="fpanel" /><text x="16" y="119" class="d dimf" font-size="11">A  LAPIS ASKS CLAUDE</text><rect x="0" y="296" width="269.79999999999995" height="26" rx="0" class="fpanel" /><text x="16" y="313" class="d dimf" font-size="11">B  CLAUDE WORKS · YOU APPROVE</text><rect x="0" y="578" width="228.79999999999998" height="26" rx="0" class="fpanel" /><text x="16" y="595" class="d dimf" font-size="11">C  THE ANSWER COMES BACK</text><line x1="106" y1="154" x2="332" y2="154" class="lnyou med" marker-end="url(#a3-y)"/><text x="220.0" y="146" class="youf" font-size="12.5" text-anchor="middle">“ask claude to review my diff”</text><circle cx="26" cy="150" r="10" class="fbg lnyou"/><text x="26" y="154" class="m numf" font-size="11" text-anchor="middle" font-weight="700">1</text><line x1="346" y1="198" x2="602" y2="198" class="ln med" marker-end="url(#a3-a)"/><text x="475.0" y="190" class="m" font-size="12" text-anchor="middle">hub_msg to="claude"</text><text x="475.0" y="214" class="dimf" font-size="11" text-anchor="middle">the hub wakes claude</text><circle cx="26" cy="194" r="10" class="fbg ln"/><text x="26" y="198" class="m numf" font-size="11" text-anchor="middle" font-weight="700">2</text><line x1="616" y1="242" x2="872" y2="242" class="lnagent thick" marker-end="url(#a3-g)"/><text x="745.0" y="234" class="m" font-size="12" text-anchor="middle">session/prompt</text><text x="745.0" y="258" class="dimf" font-size="11" text-anchor="middle">the message, marked from lapis</text><circle cx="26" cy="238" r="10" class="fbg lnagent"/><text x="26" y="242" class="m numf" font-size="11" text-anchor="middle" font-weight="700">3</text><line x1="874" y1="348" x2="618" y2="348" class="lnagent thick" marker-end="url(#a3-g)"/><text x="745.0" y="340" class="m" font-size="12" text-anchor="middle">session/update</text><text x="745.0" y="364" class="dimf" font-size="11" text-anchor="middle">tool cards and text, live in its chat</text><circle cx="26" cy="344" r="10" class="fbg lnagent"/><text x="26" y="348" class="m numf" font-size="11" text-anchor="middle" font-weight="700">4</text><line x1="874" y1="392" x2="618" y2="392" class="lnagent thick" marker-end="url(#a3-g)"/><text x="745.0" y="384" class="m" font-size="12" text-anchor="middle">session/request_permission</text><text x="745.0" y="408" class="dimf" font-size="11" text-anchor="middle">Bash: pytest -q</text><circle cx="26" cy="388" r="10" class="fbg lnagent"/><text x="26" y="392" class="m numf" font-size="11" text-anchor="middle" font-weight="700">5</text><line x1="604" y1="436" x2="108" y2="436" class="lnyou med" marker-end="url(#a3-y)"/><text x="475.0" y="428" class="youf" font-size="12" text-anchor="middle">permission prompt</text><text x="475.0" y="452" class="dimf" font-size="11" text-anchor="middle">in every window attached to claude</text><circle cx="26" cy="432" r="10" class="fbg lnyou"/><text x="26" y="436" class="m numf" font-size="11" text-anchor="middle" font-weight="700">6</text><line x1="106" y1="480" x2="602" y2="480" class="lnyou med" marker-end="url(#a3-y)"/><text x="475.0" y="472" class="youf" font-size="12" text-anchor="middle">a · approve once</text><circle cx="26" cy="476" r="10" class="fbg lnyou"/><text x="26" y="480" class="m numf" font-size="11" text-anchor="middle" font-weight="700">7</text><line x1="616" y1="524" x2="872" y2="524" class="lnagent thick" marker-end="url(#a3-g)"/><text x="745.0" y="516" class="m" font-size="12" text-anchor="middle">allow_once</text><text x="745.0" y="540" class="dimf" font-size="11" text-anchor="middle">the option Claude Code offered</text><circle cx="26" cy="520" r="10" class="fbg lnagent"/><text x="26" y="524" class="m numf" font-size="11" text-anchor="middle" font-weight="700">8</text><line x1="874" y1="630" x2="618" y2="630" class="lnagent thick" marker-end="url(#a3-g)"/><text x="745.0" y="622" class="m" font-size="12" text-anchor="middle">end_turn</text><text x="745.0" y="646" class="dimf" font-size="11" text-anchor="middle">its last text is the review</text><circle cx="26" cy="626" r="10" class="fbg lnagent"/><text x="26" y="630" class="m numf" font-size="11" text-anchor="middle" font-weight="700">9</text><line x1="604" y1="674" x2="348" y2="674" class="ln med" marker-end="url(#a3-a)"/><text x="475.0" y="666" font-size="12.5" text-anchor="middle">“2 issues: …”</text><text x="475.0" y="690" class="dimf" font-size="11" text-anchor="middle">claude's final text, on lapis's thread</text><circle cx="26" cy="670" r="10" class="fbg ln"/><text x="26" y="674" class="m numf" font-size="11" text-anchor="middle" font-weight="700">10</text><line x1="334" y1="718" x2="108" y2="718" class="lnyou med" marker-end="url(#a3-y)"/><text x="220.0" y="710" class="youf" font-size="12.5" text-anchor="middle">“claude found 2 issues: …”</text><circle cx="26" cy="714" r="10" class="fbg lnyou"/><text x="26" y="718" class="m numf" font-size="11" text-anchor="middle" font-weight="700">11</text><rect x="0" y="748" width="1000" height="2" rx="0" class="fpanel" /><line x1="20" y1="768" x2="54" y2="768" class="lnyou med" marker-end="url(#a3-y)"/><text x="64" y="772" class="m dimf" font-size="11">you</text><line x1="118.1" y1="768" x2="152.1" y2="768" class="ln med" marker-end="url(#a3-a)"/><text x="162.1" y="772" class="m dimf" font-size="11">kollab hub socket</text><line x1="310.0" y1="768" x2="344.0" y2="768" class="lnagent thick" marker-end="url(#a3-g)"/><text x="354.0" y="772" class="m dimf" font-size="11">ACP · stdio</text></svg>
