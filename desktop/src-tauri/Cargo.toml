[package]
name = "kollab-desktop"
version = "0.1.0"
description = "Kollab desktop app: a native window around the local Kollab web UI"
edition = "2021"

[lib]
name = "kollab_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
tauri = { version = "2.10", features = ["image-png"] }
tauri-plugin-dialog = "2.6"
serde_json = "1"
tokio = { version = "1", features = ["signal"] }

# Desktop only: menu bar tray, one running copy, window placement, launch at login.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri = { version = "2.10", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2.4"
tauri-plugin-window-state = "2.4"
tauri-plugin-autostart = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[features]
custom-protocol = ["tauri/custom-protocol"]
