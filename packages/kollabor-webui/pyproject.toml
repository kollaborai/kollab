[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kollabor-webui"
version = "0.18.5"
description = "Web UI for Kollab Engine"
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
dependencies = [
    "kollabor-engine>=0.18.5",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "psutil>=5.9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/kollabor_webui"]

[tool.hatch.build.targets.sdist]
# Source distributions need the frontend source and lockfile for reproducible
# rebuilds, but never vendor the local dependency tree or generated Vite output.
exclude = [
    "/frontend/node_modules",
    "/frontend/dist",
]

# hatch_build.py packages KOLLAB_FRONTEND_DIST or compiles isolated Vite output
# into kollabor_webui/static/assistant. Missing npm or failed compilation is a
# build error, never permission to substitute an older or legacy UI.
[tool.hatch.build.hooks.custom]

[tool.uv.sources]
kollabor-engine = { workspace = true }

[project.scripts]
kollabor-webui = "kollabor_webui:main"
