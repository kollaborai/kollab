[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kollabor-webui"
version = "0.7.2"
description = "Web UI for Kollab Engine"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "kollabor-engine>=0.7.2",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/kollabor_webui"]

[tool.hatch.build.targets.sdist]
# Source distributions need the frontend source and lockfile for reproducible
# rebuilds, but never vendor the local dependency tree or generated Vite output.
exclude = [
    "/frontend/node_modules",
    "/frontend/dist",
]

# hatch_build.py generates the Vite output when npm is available and copies it
# into kollabor_webui/static/assistant. If a build environment has no Node
# toolchain, the legacy static UI remains the usable fallback.
[tool.hatch.build.hooks.custom]

[tool.uv.sources]
kollabor-engine = { workspace = true }

[project.scripts]
kollabor-webui = "kollabor_webui:main"
