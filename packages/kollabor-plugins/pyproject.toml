[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kollabor-plugins"
version = "0.18.4"
description = "Plugin infrastructure for Kollabor"
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
dependencies = [
    "kollabor-events>=0.18.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/kollabor_plugins"]
