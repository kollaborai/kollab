[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kollabor-config"
version = "0.7.3"
description = "Configuration management for Kollabor"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "kollabor-events>=0.7.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/kollabor_config"]
