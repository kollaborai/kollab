[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kollabor-agent"
version = "0.18.0"
description = "Agent execution toolkit - tool execution, MCP integration, file operations, and shell commands"
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
dependencies = [
    "kollabor-events>=0.18.0",
    "kollabor-config>=0.18.0",
    "kollabor-ai>=0.18.0",
    "pyyaml>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/kollabor_agent"]
