[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kollabor-tui"
version = "0.18.5"
description = "Terminal UI primitives for Kollabor: design system, key parsing, terminal state, visual effects"
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
dependencies = [
    "kollabor-events>=0.18.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/kollabor_tui"]
