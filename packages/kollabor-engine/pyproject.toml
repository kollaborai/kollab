[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kollabor-engine"
version = "0.21.0"
description = "Kollab AI engine - HTTP/SSE server wrapping kollabor-ai and kollabor-agent"
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
dependencies = [
    "kollabor-ai>=0.21.0",
    "kollabor-agent>=0.21.0",
    "kollabor-events>=0.21.0",
    "kollabor-config>=0.21.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sse-starlette>=2.1.0",
    "psutil>=5.9",
    "cryptography>=43",
    "segno>=1.6",
    # The assistant transport adapter targets the 0.0.34 chunk/serializer
    # contract. Later releases canonicalize the stream a second time and
    # reject the protocol-shaped chunks emitted by routes.messages.
    "assistant-stream==0.0.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Pin the suite to this package's own source tree. Runs rooted at the repo
# top get pythonpath from the root pyproject; a run rooted HERE (bare
# `pytest packages/kollabor-engine/tests`, e.g. inside a worktree) reads
# this ini instead, and without pythonpath the editable install silently
# wins: the suite imports kollabor_engine from another checkout and can
# report green against the wrong tree. "src" keeps kollabor_engine local;
# ".." exposes repo-root plugins/ the way the root ini's "." does.
pythonpath = ["src", ".."]

[tool.hatch.build.targets.wheel]
packages = ["src/kollabor_engine"]
